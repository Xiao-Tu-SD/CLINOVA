<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLINOVA — Your AI Learning Companion for Medical Students</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- pdf.js — used entirely client-side to extract text from uploaded PDFs; no file ever leaves the browser -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
<style>
/* =============================================================
   CLINOVA — design tokens
   ============================================================= */
:root{
  --ink:#161B2E; --ink-soft:#5A6178;
  --paper:#F5F6FA; --panel:#FFFFFF;
  --primary:#2D3E8C; --primary-deep:#1A2454; --primary-tint:#EEF1FA;
  --teal:#0FA99B; --teal-tint:#E6FBF8;
  --coral:#D6453F; --coral-tint:#FDECEC;
  --gold:#C98A0C; --gold-tint:#FBF3DE;
  --success:#0FA968; --success-tint:#E3FAF0;
  --line:#E2E5EE; --line-strong:#CBD0DE;
  --radius-s:8px; --radius-m:14px;
  --display:"Space Grotesk", "Inter", sans-serif;
  --sans:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --y1:#2D3E8C; --y2:#0FA99B; --y3:#C98A0C; --y4:#8C3A3A; --ya:#161B2E;
}
:root[data-theme="dark"]{
  --ink:#E9EBF5; --ink-soft:#9AA3BE;
  --paper:#0F1420; --panel:#171C2C;
  --primary:#6B7FE0; --primary-deep:#8494E8; --primary-tint:#232A4A;
  --teal:#2FE0C8; --teal-tint:#16352F;
  --coral:#FF6B67; --coral-tint:#3A1E1E;
  --gold:#E0A83D; --gold-tint:#3A2F16;
  --success:#34D399; --success-tint:#163A2C;
  --line:#2A3145; --line-strong:#3A4260;
  --y1:#6B7FE0; --y2:#2FE0C8; --y3:#E0A83D; --y4:#D97B7B; --ya:#E9EBF5;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
h1,h2,h3,h4{font-family:var(--display);margin:0;font-weight:700;color:var(--ink);}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--primary-tint);}
ul{margin:0;}

/* ---------- Logo ---------- */
.logo{display:flex;align-items:center;gap:9px;}
.logo-img{height:28px;width:auto;display:block;}
.logo-fallback{display:none;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;font-family:var(--display);font-weight:700;font-size:.85rem;flex-shrink:0;}
.logo-word{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.2px;}

/* ---------- Buttons / cards / shared ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:10px 18px;font-size:.86rem;font-weight:600;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);transition:transform .08s ease,background .15s ease;}
.btn:hover{background:var(--paper);}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn.primary:hover{background:var(--primary-deep);}
[data-theme="dark"] .btn.primary{color:#0F1420;box-shadow:0 0 0 1px rgba(107,127,224,.4),0 4px 16px rgba(107,127,224,.25);}
[data-theme="dark"] .btn.primary:hover{box-shadow:0 0 0 1px rgba(107,127,224,.6),0 4px 20px rgba(107,127,224,.4);}
.btn.ghost{background:transparent;border-color:transparent;}
.btn.small{padding:6px 12px;font-size:.78rem;}
.btn.danger{border-color:var(--coral);color:var(--coral);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-m);}
.card.interactive,.subject-card{transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease;}
.card.interactive:hover,.subject-card:hover{border-color:var(--line-strong);box-shadow:0 2px 8px rgba(22,27,46,.06);transform:translateY(-1px);}
.grid{display:grid;gap:16px;}
.progress-track{height:8px;border-radius:5px;background:var(--line);overflow:hidden;}
.progress-fill{height:100%;border-radius:5px;background:var(--primary);}
.progress-fill.teal{background:var(--teal);}
.progress-fill.gold{background:var(--gold);}
.progress-fill.coral{background:var(--coral);}
.progress-fill.success{background:var(--success);}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:.72rem;font-weight:600;background:var(--primary-tint);color:var(--primary);}
.tag.teal{background:var(--teal-tint);color:var(--teal);}
.tag.coral{background:var(--coral-tint);color:var(--coral);}
.tag.gold{background:var(--gold-tint);color:var(--gold);}
.tag.success{background:var(--success-tint);color:var(--success);}
/* status badges (Accepted/Pending/Rejected) read as STATE, not label — bolder weight, tint+text never solid+white so students don't mistake them for buttons */
.tag.status{font-weight:700;}
.hairline{border:none;border-top:1px solid var(--line);margin:18px 0;}
.empty-note{color:var(--ink-soft);font-size:.86rem;font-style:italic;}
.section-title{font-size:1rem;margin-bottom:12px;}
.eyebrow{color:var(--ink-soft);font-size:.8rem;}
.page-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.page-head h1{font-size:1.6rem;}
.page-head .sub{color:var(--ink-soft);font-size:.92rem;margin-top:4px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:.78rem;color:var(--ink-soft);font-weight:600;}
.field select,.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=number],.field textarea{padding:10px 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--panel);font-size:.88rem;color:var(--ink);}
.field-row{display:flex;gap:14px;flex-wrap:wrap;}
.field-row .field{min-width:170px;flex:1;}
.pill-select{display:flex;gap:8px;flex-wrap:wrap;}
.pill-option{padding:7px 14px;border-radius:100px;border:1px solid var(--line-strong);background:var(--panel);font-size:.82rem;}
.pill-option.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.chip-multiselect{display:flex;gap:8px;flex-wrap:wrap;}
.chip-check{padding:7px 13px;border-radius:100px;border:1px solid var(--line-strong);background:var(--panel);font-size:.8rem;}
.chip-check.active{background:var(--teal);border-color:var(--teal);color:#fff;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-strong);margin-bottom:20px;flex-wrap:wrap;}
.tab-btn{background:none;border:none;padding:10px 16px;font-size:.87rem;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);}
.stat-row{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:26px;}
.stat-card{padding:16px 18px;}
.stat-card .num{font-family:var(--display);font-size:1.6rem;font-weight:700;}
.stat-card .lbl{color:var(--ink-soft);font-size:.78rem;margin-top:3px;}
.reco-list{display:flex;flex-direction:column;gap:8px;}
.reco-item{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--paper);border-radius:8px;font-size:.86rem;}
.reco-item .arrow{color:var(--primary);font-weight:700;}
.report-cols{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;}
@media (max-width:760px){.report-cols{grid-template-columns:1fr;}}
.domain-bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.domain-bar-row .lbl{width:190px;font-size:.82rem;flex-shrink:0;}
.domain-bar-row .track{flex:1;}
.domain-bar-row .score{width:44px;text-align:right;font-size:.8rem;font-weight:700;color:var(--ink-soft);}
.trend-chart{display:block;width:100%;height:auto;}

/* ---------- Home / marketing ---------- */
.home-wrap{max-width:1080px;margin:0 auto;padding:26px 24px 80px;}
.home-nav{display:flex;align-items:center;justify-content:space-between;padding:6px 0 40px;}
.home-nav .actions{display:flex;gap:10px;}
.hero{text-align:center;padding:40px 0 30px;}
.hero h1{font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.05;}
.hero .tagline{font-size:1.15rem;color:var(--ink-soft);margin-top:14px;}
.hero .subline{font-size:1rem;color:var(--primary-deep);margin-top:10px;font-weight:600;}
.hero .cta-row{display:flex;justify-content:center;gap:12px;margin-top:26px;flex-wrap:wrap;}
.feature-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:52px;}
.feature-card{padding:20px;}
.feature-card .ico{width:38px;height:38px;border-radius:10px;background:var(--primary-tint);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin-bottom:12px;}
.feature-card h3{font-size:1rem;margin-bottom:6px;}
.feature-card p{font-size:.85rem;color:var(--ink-soft);line-height:1.5;}

/* ---------- Auth ---------- */
.auth-wrap{max-width:460px;margin:40px auto;padding:0 20px 60px;}
.auth-card{padding:30px 28px;}
.auth-toggle{display:flex;gap:6px;background:var(--paper);border-radius:10px;padding:4px;margin-bottom:24px;}
.auth-toggle button{flex:1;padding:9px;border:none;background:none;border-radius:8px;font-weight:600;font-size:.86rem;color:var(--ink-soft);}
.auth-toggle button.active{background:var(--panel);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08);}

/* ---------- App shell ---------- */
.app-shell{display:none;min-height:100vh;}
body.authed .app-shell{display:flex;}
body.authed .home-view,body.authed .auth-view{display:none;}

.sidebar{width:232px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;}
.sidebar .logo{padding:6px 8px 24px;}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-item{display:flex;align-items:center;gap:12px;background:transparent;border:none;color:var(--ink-soft);text-align:left;padding:10px 12px 10px 13px;border-radius:0 8px 8px 0;font-size:.9rem;font-weight:500;border-left:3px solid transparent;transition:background-color .15s ease,color .15s ease;}
.nav-ico{width:20px;text-align:center;}
.nav-item:hover{background:var(--primary-tint);color:var(--ink);}
.nav-item.active{background:var(--primary-tint);color:var(--primary-deep);border-left:3px solid var(--primary);font-weight:600;}
.nav-item.active .nav-ico{color:var(--primary);}
.nav-divider{height:1px;background:var(--line);margin:10px 4px;}
.sidebar-footer{display:flex;flex-direction:column;gap:8px;}

.profile-chip{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 10px;}
.profile-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;}
.profile-avatar.small{width:28px;height:28px;}
.profile-meta{display:flex;flex-direction:column;flex:1;text-align:left;line-height:1.2;overflow:hidden;}
.profile-name{font-size:.82rem;font-weight:700;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;}
.profile-sub{font-size:.7rem;color:var(--ink-soft);}

.topbar{display:flex;align-items:center;gap:12px;padding:14px 30px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20;}
.topbar .search-box{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 12px;}
.topbar .search-box input{border:none;background:none;outline:none;font-size:.86rem;flex:1;}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--coral);}
.mobile-topbar{display:none;}
.hamburger{background:none;border:none;font-size:1.3rem;color:var(--ink);}

.main{flex:1;min-width:0;padding:28px 34px 60px;}
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s ease;box-shadow:8px 0 24px rgba(0,0,0,.15);}
  .sidebar.open{transform:translateX(0);}
  .mobile-topbar{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:30;}
  body.authed .app-shell{flex-direction:column;}
  .topbar{display:none;}
  .main{padding:18px 16px 90px;}
}

/* ---------- Subject cards ---------- */
.subject-strip{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px;margin:0 -4px 8px;}
.subject-strip::-webkit-scrollbar{height:6px;}
.subject-strip::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px;}
.subject-card{min-width:235px;max-width:235px;flex-shrink:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;display:flex;flex-direction:column;}
.subject-card .tab{height:6px;}
.subject-card .body{padding:15px 16px 16px;display:flex;flex-direction:column;gap:9px;flex:1;}
.subject-card h3{font-size:1.02rem;}
.subject-card .year-lbl{font-size:.7rem;color:var(--ink-soft);}
.subject-card .stat-line{display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink-soft);}
.subject-card .weak-line{font-size:.76rem;color:var(--coral);}
.subject-card .btn{align-self:flex-start;margin-top:auto;}
.subject-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}

/* ---------- Topics ---------- */
.topic-list{display:flex;flex-direction:column;gap:8px;}
.topic-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--panel);}
.topic-row .name{flex:1;font-weight:600;font-size:.92rem;}
.topic-row .pct{width:110px;}
.topic-row .pct-num{font-size:.74rem;color:var(--ink-soft);margin-bottom:3px;}

/* ---------- Track table ---------- */
.track-table{width:100%;border-collapse:collapse;font-size:.86rem;}
.track-table th{text-align:left;padding:10px 12px;color:var(--ink-soft);font-weight:700;font-size:.74rem;border-bottom:1px solid var(--line-strong);}
.track-table td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
.track-table tr:hover td{background:rgba(91,76,240,.035);}
.track-table .subj-name{font-weight:700;}
.track-table .actions{display:flex;gap:6px;flex-wrap:wrap;}

/* ---------- Quiz / Cases / Viva ---------- */
.quiz-card{padding:24px;max-width:640px;}
.quiz-stem{font-size:1.05rem;font-weight:600;margin-bottom:16px;line-height:1.5;}
.quiz-options{display:flex;flex-direction:column;gap:9px;}
.quiz-option{text-align:left;padding:11px 14px;border:1px solid var(--line-strong);border-radius:9px;background:var(--panel);font-size:.9rem;}
.quiz-option:hover{border-color:var(--primary);}
.quiz-option.correct{border-color:var(--success);background:var(--success-tint);}
.quiz-option.incorrect{border-color:var(--coral);background:var(--coral-tint);}
.quiz-option:disabled{cursor:default;}
.quiz-explain{margin-top:16px;padding:14px;border-radius:9px;background:var(--paper);font-size:.86rem;line-height:1.55;}
.quiz-explain b{color:var(--primary);}
.quiz-progress-lbl{font-size:.78rem;color:var(--ink-soft);margin-bottom:10px;}
.case-card{padding:22px;max-width:720px;display:flex;flex-direction:column;gap:16px;}
.case-vignette{font-size:.95rem;line-height:1.6;background:var(--paper);padding:14px 16px;border-radius:9px;border-left:3px solid var(--primary);}
.case-step-lbl{font-size:.78rem;font-weight:700;color:var(--primary);letter-spacing:.2px;}
.case-choice-grid{display:flex;flex-direction:column;gap:8px;}
.case-choice{text-align:left;padding:10px 13px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);font-size:.87rem;}
.case-choice.selected{border-color:var(--primary);background:var(--primary-tint);}
.case-feedback{background:var(--paper);border-radius:9px;padding:14px 16px;font-size:.86rem;line-height:1.55;}
.viva-card{padding:22px;max-width:640px;display:flex;flex-direction:column;gap:14px;}
.viva-q{font-size:1rem;font-weight:600;}
.viva-card textarea{width:100%;min-height:110px;border:1px solid var(--line-strong);border-radius:9px;padding:11px 13px;font-size:.9rem;resize:vertical;}
.viva-result{background:var(--paper);border-radius:9px;padding:14px 16px;font-size:.86rem;line-height:1.6;}
.viva-score{font-family:var(--display);font-size:1.5rem;font-weight:700;color:var(--primary);}

/* ---------- Flashcards ---------- */
.flash-shell{max-width:520px;margin:0 auto;}
.flashcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:40px 30px;min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.1rem;font-weight:600;cursor:pointer;box-shadow:0 2px 10px rgba(20,20,50,.05);}
.flashcard .eyebrow{position:absolute;}
.flash-meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink-soft);margin-bottom:10px;}
.flash-rate-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;}
.flash-rate-row button{padding:11px 6px;border-radius:9px;border:1px solid var(--line-strong);background:var(--panel);font-size:.8rem;font-weight:700;}
.flash-rate-row button.again{color:var(--coral);}
.flash-rate-row button.hard{color:var(--gold);}
.flash-rate-row button.good{color:var(--primary);}
.flash-rate-row button.easy{color:var(--teal);}
.flash-stats{display:flex;gap:16px;justify-content:center;margin-top:18px;font-size:.8rem;color:var(--ink-soft);}

/* ---------- Mock test ---------- */
.mock-shell{display:grid;grid-template-columns:1fr 220px;gap:20px;}
@media (max-width:820px){.mock-shell{grid-template-columns:1fr;}}
.mock-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.mock-timer{font-family:var(--display);font-size:1.3rem;font-weight:700;color:var(--primary);}
.mock-timer.low{color:var(--coral);}
.q-palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.q-pill{aspect-ratio:1;border-radius:7px;border:1px solid var(--line-strong);background:var(--panel);font-size:.76rem;font-weight:700;display:flex;align-items:center;justify-content:center;}
.q-pill.answered{background:var(--teal);color:#fff;border-color:var(--teal);}
.q-pill.marked{background:var(--gold);color:#fff;border-color:var(--gold);}
.q-pill.current{outline:2px solid var(--primary);outline-offset:1px;}

/* ---------- OSCE / AI patient chat ---------- */
.osce-shell{display:grid;grid-template-columns:260px 1fr;gap:20px;}
@media (max-width:820px){.osce-shell{grid-template-columns:1fr;}}
.osce-brief{padding:18px;display:flex;flex-direction:column;gap:12px;height:fit-content;}
.osce-timer{font-family:var(--display);font-size:1.8rem;font-weight:700;color:var(--primary);}
.osce-timer.low{color:var(--coral);}
.domain-pill{display:inline-block;font-size:.7rem;background:var(--primary-tint);color:var(--primary);padding:2px 8px;border-radius:100px;margin:2px 3px 0 0;}
.chat-shell{display:flex;flex-direction:column;height:560px;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--panel);overflow:hidden;}
.chat-log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:.88rem;line-height:1.5;}
.msg.patient{background:var(--paper);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;}
.msg.student{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.msg.system{align-self:center;font-size:.76rem;color:var(--ink-soft);background:none;}
.msg .speak-btn{margin-left:8px;font-size:.72rem;opacity:.7;border:none;background:none;cursor:pointer;}
.chat-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);}
.chat-input-row textarea{flex:1;border:1px solid var(--line-strong);border-radius:9px;padding:9px 12px;font-size:.88rem;resize:none;min-height:42px;max-height:110px;}
.mic-btn{width:44px;height:44px;border-radius:9px;border:1px solid var(--primary-tint);background:var(--primary-tint);color:var(--primary);flex-shrink:0;font-size:1.25rem;transition:background-color .15s ease,color .15s ease,transform .1s ease;}
.mic-btn:hover{background:var(--primary);color:#fff;transform:translateY(-1px);}
.mic-btn.listening{background:var(--coral);border-color:var(--coral);color:#fff;animation:pulse 1.1s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,83,61,.5);}70%{box-shadow:0 0 0 9px rgba(229,83,61,0);}100%{box-shadow:0 0 0 0 rgba(229,83,61,0);}}
.station-card{padding:18px;display:flex;flex-direction:column;gap:10px;}
.station-card .mins{font-size:.76rem;color:var(--ink-soft);}
.station-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- Tutor ---------- */
.tutor-shell{max-width:760px;margin:0 auto;}
.tutor-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.tutor-chip{font-size:.78rem;padding:6px 12px;border-radius:100px;border:1px solid var(--line-strong);background:var(--panel);}
.tutor-chip:hover{border-color:var(--primary);color:var(--primary);}
.tutor-chip.voice{background:var(--primary-tint);border-color:var(--primary-tint);color:var(--primary);font-weight:600;}
.tutor-chip.voice:hover{background:var(--primary);color:#fff;}
.tutor-chip.voice.listening{background:var(--coral);border-color:var(--coral);color:#fff;animation:pulse 1.1s infinite;}

/* ---------- Upload ---------- */
.upload-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius-s);margin-bottom:10px;flex-wrap:wrap;}
.upload-row .file-ico{width:36px;height:36px;border-radius:8px;background:var(--primary-tint);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.upload-row .meta{flex:1;min-width:180px;}
.upload-row .name{font-weight:700;font-size:.88rem;}
.upload-row .sub{font-size:.76rem;color:var(--ink-soft);}
.status-pill{font-size:.72rem;padding:3px 9px;border-radius:100px;font-weight:700;}
.status-pill.processing{background:var(--gold-tint);color:var(--gold);}
.status-pill.processed{background:var(--success-tint);color:var(--success);}
.upload-actions{display:flex;gap:6px;flex-wrap:wrap;}

/* ---------- Admin ---------- */
.admin-subject-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;}
.admin-subject-row .name{font-weight:700;flex:1;}
.topic-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.topic-chip{font-size:.76rem;padding:4px 10px;border-radius:100px;background:var(--paper);border:1px solid var(--line);}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;z-index:100;}
.modal-box{background:var(--panel);border-radius:16px;max-width:640px;width:100%;padding:26px 28px 28px;position:relative;}
.modal-box.wide{max-width:760px;}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:1.2rem;color:var(--ink-soft);}
.modal-box h2{font-size:1.3rem;margin-bottom:4px;}
.notif-item{padding:11px 12px;border-radius:9px;background:var(--paper);margin-bottom:8px;font-size:.85rem;}
.notif-item b{display:block;font-size:.8rem;color:var(--primary);margin-bottom:2px;}
.search-result-group{margin-bottom:16px;}
.search-result-group h4{font-size:.8rem;color:var(--ink-soft);margin-bottom:6px;}
.search-result-item{padding:9px 11px;border-radius:8px;font-size:.86rem;}
.search-result-item:hover{background:var(--paper);}

/* ---------- Floating voice button ---------- */
.voice-fab{position:fixed;bottom:26px;right:26px;width:58px;height:58px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:1.4rem;box-shadow:0 6px 20px rgba(45,62,140,.35);z-index:60;display:none;align-items:center;justify-content:center;transition:background-color .15s ease,box-shadow .15s ease,transform .15s ease;}
body.authed .voice-fab{display:flex;}
.voice-fab:hover{background:var(--primary-deep);transform:translateY(-2px);box-shadow:0 8px 24px rgba(45,62,140,.42);}
.voice-fab.listening{background:var(--coral);box-shadow:0 6px 20px rgba(214,69,63,.4);animation:pulse 1.4s infinite;}
@media (max-width:900px){.voice-fab{bottom:80px;}}

/* ---------- Splash screen (M.I.C.E Labs presents CLINOVA) ---------- */
.splash-screen{position:fixed;inset:0;z-index:500;background:#0B1220;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .4s ease;}
.splash-screen.fade-out{opacity:0;pointer-events:none;}
.splash-grid-bg{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px, transparent 1px);background-size:28px 28px;-webkit-mask-image:radial-gradient(circle at 50% 42%, black 0%, transparent 68%);mask-image:radial-gradient(circle at 50% 42%, black 0%, transparent 68%);}
.splash-content{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px;text-align:center;opacity:0;transform:translateY(10px);animation:splashFadeIn .8s ease forwards;}
.splash-logo-img{width:88px;height:88px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid rgba(255,255,255,.18);box-shadow:0 0 0 6px rgba(255,255,255,.04);margin-bottom:10px;}
.splash-presents{font-family:var(--sans);font-size:.72rem;letter-spacing:.4em;color:#8A93A8;text-transform:uppercase;margin-bottom:10px;}
.splash-title{font-family:var(--display);font-weight:700;font-size:2.4rem;letter-spacing:.01em;line-height:1.1;}
.splash-title.white{color:#fff;}
.splash-title.accent{color:var(--teal);}
.splash-underline{width:48px;height:3px;background:var(--teal);border-radius:2px;margin-top:16px;}
@keyframes splashFadeIn{to{opacity:1;transform:translateY(0);}}
</style>
</head>

function slugify(s){ return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function mulberry32(seed){ return function(){ seed|=0; seed=(seed+0x6D2B79F5)|0; let t=Math.imul(seed^seed>>>15,1|seed); t=(t+Math.imul(t^t>>>7,61|t))^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return h; }
function pct(n){ return Math.max(0,Math.min(100,Math.round(n))); }
function esc(str){ const d=document.createElement('div'); d.textContent = str==null?'':String(str); return d.innerHTML; }

// exact figures from the brief (Sections 24 & 28) so the demo lands on the same numbers
const ANATOMY_TOPIC_SEED = { 'General Anatomy':82,'Upper Limb':84,'Lower Limb':74,'Thorax':68,'Abdomen':61,'Neuroanatomy':52 };
// (No fake historical seed data here anymore — activity counts, recent-performance
// history, and AETCOM competency domains all start genuinely empty and are filled
// in only by real actions. See freshProgressFor().)

function buildTopicProgress(subject){
  const rnd = mulberry32(hashStr(subject.id));
  const out = {};
  subject.topics.forEach(t => {
    if (subject.id === 'human-anatomy' && ANATOMY_TOPIC_SEED[t.name] !== undefined){ out[t.name] = ANATOMY_TOPIC_SEED[t.name]; return; }
    out[t.name] = Math.max(35, Math.min(92, 65 + Math.round((rnd()-0.5)*40)));
  });
  return out;
}
/* A brand-new "Recent performance" trend has no real history yet — start
   flat at the current baseline rather than inventing an upward-trending
   history. It only starts moving once real attempts push real values in
   (see updateSubjectProgress / submitMock / recordMCQAttempt). */
function buildRecent(subject, avg){
  return [avg, avg, avg, avg];
}

function freshProgressFor(subject){
  const topicProgress = buildTopicProgress(subject);
  const vals = Object.values(topicProgress);
  const overallProgress = pct(vals.reduce((a,b)=>a+b,0)/vals.length);
  // Topic mastery (above) is a defensible non-arbitrary baseline — it
  // stands in for whatever the student already knows from the textbook
  // before ever opening the app. Everything below this line is an
  // ACTIVITY COUNT (things the student has actually done in the app),
  // and those have no honest reason to start above zero — they only
  // grow through genuine actions (see recordMCQAttempt, submitMock,
  // rateFlashcard, advanceCase, submitViva, recordTopicRead,
  // finishOsceStation).
  const averageScore = overallProgress;
  const totalTopics = subject.topics.length;
  const p = {
    overallProgress, averageScore,
    questionsAttempted: 0, topicsCompleted: 0, totalTopics,
    flashcardsCompleted: 0, mockTests: 0, clinicalCases: 0, vivaAttempts: 0,
    weakAreas: [], topicProgress, topicReadDates: {},
    attempts: buildRecent(subject, averageScore),
    flashState:{},
  };
  if (subject.id === 'aetcom'){
    // Competency domains and OSCE stats start unassessed — they're
    // filled in genuinely as real OSCE stations get completed (see
    // applyOsceToCompetencies / finishOsceStation).
    p.domains = { Communication:null, Empathy:null, Consent:null, Confidentiality:null, Professionalism:null, 'Patient Autonomy':null };
    p.osceStations = 0; p.osceAvg = 0;
    p.mostConsistentWeakness = null;
    p.bestImprovement = null;
    p.osceHistory = [];
  }
  return p;
}

function freshState(){
  const subjects = DEFAULT_SUBJECTS.map(s => ({...s, topics:s.topics.map(t=>({...t}))}));
  const progress = {};
  subjects.forEach(s => { progress[s.id] = freshProgressFor(s); });
  return {
    dataVersion: 2, // bump this if a future change needs another one-time migration — see migrateToGenuineTracking()
    auth: { loggedIn:false, profile:null },
    subjects, progress,
    uploads: [],
    activityDates: [], // genuine study-streak tracking — see calculateStreak()/recordActivity()
    feedback: [],       // see CHANGE 3/4 — student-submitted feedback, points derived from this array
    students: {},       // directory of every profile that has ever logged in on this browser, keyed by lowercased email — powers the leaderboard (see registerStudentInDirectory())
    leaderboardSettings: { period:'all', type:'students', year:'all' },
    lastMCQSessionIds: {},  // subject|topic -> question ids used last session, so "Practise again" avoids repeats
    lastFlashDeckIds: {},   // subject|topic (or upload:id) -> card ids used last deck

}

/* One-time migration for browsers that already saved a CLINOVA session
   before "genuine tracking" existed — those saves have the OLD hard-coded
   demo numbers baked in (e.g. 186 questions attempted, 240 flashcards,
   12 clinical cases, a fake AETCOM OSCE history) that were never real
   activity. This resets exactly those activity COUNTS to genuine zero,
   without touching anything that's actually real: the student's profile,
   their submitted feedback, their earned points, or their topic-mastery
   baselines (which represent assumed prior textbook knowledge, not an
   activity count, and were never the issue). Runs once per browser —
   dataVersion gets stamped afterward so it's never re-applied. */
function migrateToGenuineTracking(state){
  if ((state.dataVersion || 0) >= 2) return state;
  Object.keys(state.progress || {}).forEach(id => {
    const p = state.progress[id];
    if (!p) return;
    p.questionsAttempted = 0;
    p.mockTests = 0;
    p.flashcardsCompleted = 0;
    p.clinicalCases = 0;
    p.vivaAttempts = 0;
    p.topicReadDates = {};
    p.attempts = [p.averageScore, p.averageScore, p.averageScore, p.averageScore]; // no real attempt history exists yet — start the trend flat, not with an invented upward curve
    if (id === 'aetcom'){
      p.domains = { Communication:null, Empathy:null, Consent:null, Confidentiality:null, Professionalism:null, 'Patient Autonomy':null };
      p.osceStations = 0; p.osceAvg = 0; p.mostConsistentWeakness = null; p.bestImprovement = null; p.osceHistory = [];
    }
  });
  state.activityDates = []; // study streak resets to genuine zero too — it was never tracked before this version anyway
  state.dataVersion = 2;
  return state;
}

/* Genuine study-streak tracking: recordActivity() is called by every
   real study action (see its call sites below); calculateStreak()
   counts consecutive calendar days of activity ending today (or
   ending yesterday if nothing has happened yet today, so the streak
   doesn't zero out at midnight before the student has had a chance
   to study). */
function recordActivity(){
  const today = new Date().toISOString().slice(0,10);
  STATE.activityDates = STATE.activityDates || [];
  if (!STATE.activityDates.includes(today)) STATE.activityDates.push(today);
  saveState();
}
function calculateStreak(){
  const dates = new Set(STATE.activityDates || []);
  if (!dates.size) return 0;
  let cursor = new Date();
  if (!dates.has(cursor.toISOString().slice(0,10))) cursor.setDate(cursor.getDate() - 1);
  let streak = 0;
  while (dates.has(cursor.toISOString().slice(0,10))){ streak++; cursor.setDate(cursor.getDate() - 1); }
  return streak;
}

let STATE = loadState();
saveState(); // ensures any one-time migration correction (see migrateToGenuineTracking) is written back immediately, not left waiting for the next unrelated action to trigger a save
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return freshState();
    let parsed = JSON.parse(raw);
    if (!parsed.subjects || !parsed.progress) return freshState();
    // Backward compatibility: older saved states won't have these fields yet.
    parsed.feedback = parsed.feedback || [];
    parsed.students = parsed.students || {};
    parsed.leaderboardSettings = parsed.leaderboardSettings || { period:'all', type:'students', year:'all' };
    parsed.lastMCQSessionIds = parsed.lastMCQSessionIds || {};
    parsed.lastFlashDeckIds = parsed.lastFlashDeckIds || {};
    parsed.theme = parsed.theme || 'light';
    parsed = migrateToGenuineTracking(parsed);
    return parsed;
  }catch(e){ return freshState(); }
}
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); return true; }catch(e){ console.warn('storage failed', e); return false; } }
function resetAllData(){ STATE = freshState(); saveState(); location.reload(); }

/* "Night Shift" dark mode — see the design-system spec for the full
   token rationale. Applying the theme only ever toggles the
   `data-theme` attribute on <html>; every color in the app is driven
   through CSS custom properties, so no component markup needs to
   know or care which theme is active. */

  document.documentElement.dataset.theme = STATE.theme === 'dark' ? 'dark' : '';

}

}

function calculateWeakAreas(subjectId, n){
  n = n || 2;
  const p = getSubjectProgress(subjectId);
  if (subjectId === 'aetcom' && p.domains){
    const assessed = Object.entries(p.domains).filter(([,v]) => v!==null && v!==undefined);

    // no OSCE stations completed yet — fall back to topic mastery like any other subject
  }
  return Object.entries(p.topicProgress).sort((a,b)=>a[1]-b[1]).slice(0,n).map(e=>e[0]);

/* =============================================================
   QUESTION / FLASHCARD UNIQUENESS ENGINE
   Two things are considered duplicates only if their normalized
   stems/fronts match — not by object identity, and not just because
   the answer options happen to be shuffled differently.
   ============================================================= */
function shuffleArray(arr){ const a=[...arr]; for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function normalizeQuestion(text){ return (text||'').toLowerCase().replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim(); }
function normalizeFlashcard(front, back){ return normalizeQuestion(front) + '||' + normalizeQuestion(back||''); }
function makeQuestionId(subjectId, topic, stem){ return subjectId + '::' + (topic||'') + '::' + normalizeQuestion(stem); }
function makeFlashcardId(subjectId, topic, front, back){ return subjectId + '::' + (topic||'') + '::' + normalizeFlashcard(front, back); }
function isDuplicateQuestion(stemA, stemB){ return normalizeQuestion(stemA) === normalizeQuestion(stemB); }
function isDuplicateFlashcard(cardA, cardB){ return normalizeFlashcard(cardA.front, cardA.back) === normalizeFlashcard(cardB.front, cardB.back); }

// Used only once the real question bank is exhausted for a topic/subject —
// rewords an already-used bank question rather than repeating it verbatim.
// This is an honest mock-mode stand-in; a live AI/RAG generator replaces it.
const STEM_VARIANT_WRAPPERS = [
  s => `Which of the following correctly answers this: ${s}`,
  s => `From the options given, which one correctly addresses: ${s}`,
  s => `Identify the best answer to the following: ${s}`,
  s => `Select the option that correctly completes this: ${s}`,
  s => `Which choice below is accurate with respect to: ${s}`,
];
function buildVariantStem(stem, cycle){ return STEM_VARIANT_WRAPPERS[cycle % STEM_VARIANT_WRAPPERS.length](stem); }

function shapeQuestion(subjectId, bankEntry, stemOverride, difficulty, examType, isVariant){
  const stem = stemOverride || bankEntry.stem;
  const idxs = shuffleArray(bankEntry.options.map((_,i)=>i));
  const options = idxs.map(i=>bankEntry.options[i]);
  const correct = idxs.indexOf(bankEntry.correct);
  const why = isVariant
    ? bankEntry.why + ' (Rephrased variant to avoid repeating a question already used this session — same underlying fact; a live AI/RAG generator would produce a genuinely new question here instead.)'
    : bankEntry.why;
  return {
    id: makeQuestionId(subjectId, bankEntry.topic, stem),
    topic: bankEntry.topic, stem, options, correct, why,
    difficulty: difficulty||'MBBS level', examType: examType||'University', isVariant: !!isVariant,
  };
}

/* AI ENGINE: generateMCQs(subjectId, topic, difficulty, examType, count, options)
   options: { excludeQuestionIds, previousQuestionIds, sessionQuestionIds } — any
   question whose id appears in these lists is skipped. Generates the FULL
   set up front (never one-at-a-time with plain Math.random()), draws each
   bank question at most once, widens from topic to the whole subject once
   the topic pool is exhausted, and only falls back to honestly-labeled
   reworded variants once real bank content truly runs out. Always returns
   exactly `count` questions with distinct normalized stems. */
function generateMCQs(subjectId, topic, difficulty, examType, count, options){
  options = options || {};
  count = count || 1;
  const usedIds = new Set([...(options.excludeQuestionIds||[]), ...(options.previousQuestionIds||[]), ...(options.sessionQuestionIds||[])]);
  const subj = getSubject(subjectId);
  const bank = MCQ_BANK[subjectId] || [];
  const topicPool = topic ? bank.filter(q=>q.topic===topic) : bank;
  const out = [];

  const draw = (pool) => {
    for (const entry of shuffleArray(pool)){
      if (out.length >= count) return;
      const q = shapeQuestion(subjectId, entry, null, difficulty, examType, false);
      if (usedIds.has(q.id)) continue;
      out.push(q); usedIds.add(q.id);
    }
  };
  draw(topicPool);
  if (out.length < count) draw(bank); // widen to the whole subject once the topic-specific pool is exhausted

  const sourcePool = topicPool.length ? topicPool : bank;
  let cycle = 0;
  while (out.length < count && sourcePool.length && cycle < sourcePool.length * STEM_VARIANT_WRAPPERS.length){
    const entry = sourcePool[cycle % sourcePool.length];
    const variantStem = buildVariantStem(entry.stem, Math.floor(cycle / sourcePool.length));
    const q = shapeQuestion(subjectId, entry, variantStem, difficulty, examType, true);
    if (!usedIds.has(q.id)){ out.push(q); usedIds.add(q.id); }
    cycle++;
  }
  let fallbackN = 0;
  while (out.length < count){
    const gq = genericMCQ(subj, topic);
    out.push({ id: makeQuestionId(subjectId, topic, gq.stem+' #'+(++fallbackN)), ...gq, difficulty:difficulty||'MBBS level', examType:examType||'University', isVariant:false });
  }
  return out.slice(0, count);
}
/* Convenience wrapper for the few call sites that just want one question
   (e.g. the AI Tutor's inline quiz preview) — internally just asks
   generateMCQs() for a single-item batch. */
function generateSingleMCQ(subjectId, topic, difficulty, examType, excludeIds){
  return generateMCQs(subjectId, topic, difficulty, examType, 1, { excludeQuestionIds: excludeIds||[] })[0];
}

/* AI ENGINE: evaluateViva(subjectId, question, answer) — heuristic
   keyword coverage; a real backend would replace this with an
   LLM rubric-graded score. */
function evaluateViva(subjectId, question, answer){
  const lower = (answer||'').toLowerCase();
  const hit = question.points.filter(p=>lower.includes(p.toLowerCase()));
  const missing = question.points.filter(p=>!hit.includes(p));
  const score = Math.round((hit.length/question.points.length)*10);
  let feedback = score>=8 ? 'Strong, comprehensive answer covering nearly all key points.' : score>=5 ? 'Reasonable answer, but several important points were missing.' : 'The answer needs more depth — revisit the core concept before your next attempt.';
  return { score, hit, missing, feedback };
}

// Distinctly-worded generic templates used only once real bank cards are
// exhausted — cycled so the same literal string is never produced twice
// for the same topic (unlike the old single repeated template).
const GENERIC_CARD_TEMPLATES = [
  (t)=>({ q:`What is a key fact about ${t}?`, a:`Demo card — connect generateFlashcards() to your textbook/PDF RAG pipeline to generate real ${t} content here.` }),
  (t)=>({ q:`Define an important term related to ${t}.`, a:`Demo card — connect a real content source for ${t} definitions.` }),
  (t)=>({ q:`Why is ${t} clinically or academically significant?`, a:`Demo card — connect a real content source to explain the significance of ${t}.` }),
  (t)=>({ q:`Name a structure or concept commonly associated with ${t}.`, a:`Demo card — connect a real content source for ${t}.` }),
  (t)=>({ q:`What would a first-year student most need to remember about ${t}?`, a:`Demo card — connect a real content source for ${t}.` }),
];
/* AI ENGINE: generateFlashcards(subjectId, topic, source, count, options)
   source ∈ 'bank' | 'textbook' | 'upload' | 'ai' — in mock mode all
   sources fall back to the curated bank or a distinctly-worded templated
   card. options: { excludeCardIds, previousCardIds } — every card in the
   returned deck has a unique normalized front+back. */
function generateFlashcards(subjectId, topic, source, count, options){
  options = options || {};
  count = count || 6;
  const subj = getSubject(subjectId);
  const bank = FLASHCARD_BANK[subjectId] || [];
  const topicPool = topic ? bank.filter(c=>c.topic===topic) : bank;
  const seen = new Set([...(options.excludeCardIds||[]), ...(options.previousCardIds||[])]);
  const out = [];

  const draw = (pool) => {
    for (const c of shuffleArray(pool)){
      if (out.length >= count) return;
      const id = makeFlashcardId(subjectId, c.topic, c.front, c.back);
      if (seen.has(id)) continue;
      out.push({ id, topic:c.topic, front:c.front, back:c.back });
      seen.add(id);
    }
  };
  draw(topicPool);
  if (out.length < count) draw(bank); // widen to the whole subject once the topic pool is exhausted

  const topics = topic ? [topic] : (subj.topics.length ? subj.topics.map(t=>t.name) : [subj.name]);
  let templateCycle = 0, ti = 0;
  const maxAttempts = topics.length * GENERIC_CARD_TEMPLATES.length * 4;
  while (out.length < count && templateCycle < maxAttempts){
    const t = topics[ti % topics.length];
    const tmpl = GENERIC_CARD_TEMPLATES[templateCycle % GENERIC_CARD_TEMPLATES.length];
    const card = tmpl(t);
    const id = makeFlashcardId(subjectId, t, card.q, card.a);
    if (!seen.has(id)){ out.push({ id, topic:t, front:card.q, back:card.a }); seen.add(id); }
    templateCycle++; ti++;
  }
  return out.slice(0, count);
}

function classifyMessage(text){
  const t = text.toLowerCase();
  const has = arr => arr.some(p=>t.includes(p));
  return { empathy:has(EMPATHY_PHRASES), jargon:JARGON_TERMS.filter(j=>t.includes(j)), consent:has(CONSENT_PHRASES),
    checksUnderstanding:has(CHECK_UNDERSTANDING_PHRASES), closing:has(CLOSING_PHRASES),
    isQuestion:t.trim().endsWith('?')||t.startsWith('what')||t.startsWith('how')||t.startsWith('can you')||t.startsWith('tell me')||t.startsWith('why'),
    length:text.trim().split(/\s+/).length };
}
/* AI ENGINE: generateOSCE(stationId) — returns the station config
   (task, patient, domains) used to start a session. */
function generateOSCE(stationId){ return OSCE_STATIONS.find(s=>s.id===stationId) || OSCE_STATIONS[0]; }

/* AI ENGINE: generatePatientResponse(session, studentMessage) — the
   mock stand-in for a real conversational LLM patient. */
function generatePatientResponse(session, studentMessage){
  const cls = classifyMessage(studentMessage);
  session.log.push({ role:'student', text:studentMessage, tags:cls });
  if (cls.jargon.length){ session.anxiety=Math.min(100,session.anxiety+12); session.rapport=Math.max(0,session.rapport-4); }
  if (cls.empathy){ session.rapport=Math.min(100,session.rapport+10); session.anxiety=Math.max(0,session.anxiety-8); }
  if (cls.consent){ session.consentDiscussed = true; }
  if (cls.checksUnderstanding){ session.understanding=Math.min(100,session.understanding+15); }
  if (cls.closing){ session.closed = true; }
  if (!cls.empathy && !cls.isQuestion && cls.length<6){ session.anxiety=Math.min(100,session.anxiety+5); }

  let reply;
  if (cls.jargon.length){ reply = `Sorry doctor, I don't really understand what "${cls.jargon[0]}" means. Could you explain it more simply?`; }
  else if (session.revealIdx < session.patient.concerns.length && (cls.isQuestion||cls.empathy||session.log.filter(m=>m.role==='student').length%2===0)){ reply = session.patient.concerns[session.revealIdx]; session.revealIdx++; }
  else if (session.anxiety > 70){ reply = `I'm sorry, I'm just really anxious about all this. ${session.patient.concerns[Math.floor(Math.random()*session.patient.concerns.length)]}`; }
  else if (session.rapport > 70 && session.hiddenRevealed < session.patient.hidden.length && Math.random()<0.5){ reply = `Actually, doctor, since you ask... ${session.patient.hidden[session.hiddenRevealed]}`; session.hiddenRevealed++; }
  else if (cls.checksUnderstanding){ reply = session.understanding>60 ? 'Yes, I think I understand now, thank you for explaining that.' : 'I think so... but could you go over that part again?'; }
  else if (cls.closing){ reply = 'Thank you, doctor. I feel a little better having talked this through.'; }
  else { const filler=['I see.','Okay, go on.','Alright.','Hmm, I hadn\'t thought of it that way.']; reply = filler[Math.floor(Math.random()*filler.length)]; }
  session.log.push({ role:'patient', text:reply });
  return { reply, session };
}

/* AI ENGINE: evaluateOSCE(session, station) — the "AI Examiner". */
function evaluateOSCE(session, station){
  const studentMsgs = session.log.filter(m=>m.role==='student');
  const empathyCount = studentMsgs.filter(m=>m.tags&&m.tags.empathy).length;
  const jargonCount = studentMsgs.reduce((a,m)=>a+(m.tags?m.tags.jargon.length:0),0);
  const questionCount = studentMsgs.filter(m=>m.tags&&m.tags.isQuestion).length;
  const checkCount = studentMsgs.filter(m=>m.tags&&m.tags.checksUnderstanding).length;
  const scoreFor = (domain) => {
    switch(domain){
      case 'Introduction': return studentMsgs.length ? 8 : 2;
      case 'Rapport': return Math.min(10, 4+Math.round(session.rapport/14));
      case 'Empathy': return Math.min(10, empathyCount*3+2);
      case 'Explanation': return Math.min(10, 5+(jargonCount===0?3:-jargonCount));
      case 'Jargon Avoidance': return Math.max(1, 10-jargonCount*3);
      case 'Consent': return session.consentDiscussed ? 10 : 3;
      case 'Understanding': return Math.min(10, checkCount*4+2);
      case 'Closing': return session.closed ? 9 : 3;
      default: return 6;
    }
  };
  const domainScores = {};
  station.domains.forEach(d => { domainScores[d] = Math.max(1, Math.min(10, scoreFor(d))); });
  const total = Object.values(domainScores).reduce((a,b)=>a+b,0);
  const overall = Math.round((total/(station.domains.length*10))*100);
  const good=[], improve=[], missed=[];
  station.domains.forEach(d => { if (domainScores[d]>=8) good.push(d); else if (domainScores[d]>=5) improve.push(d); else missed.push(d); });
  return { domainScores, overall, good, improve, missed, questionCount };
}

/* Genuine AETCOM competency tracking. A completed OSCE station's own
   domain scores (Introduction/Rapport/Empathy/etc — see OSCE_STATIONS)
   use a different, per-station vocabulary than the subject-level
   competencies shown on the AETCOM progress report (Communication/
   Empathy/Consent/Confidentiality/Professionalism/Patient Autonomy).
   This maps the overlap and blends it in as a running average, so the
   competency percentages genuinely reflect completed stations instead
   of sitting at a fixed number forever. A competency with no station
   coverage yet stays null ("Not yet assessed") rather than guessing. */
const STATION_DOMAIN_TO_COMPETENCY = {
  'Introduction':'Communication', 'Rapport':'Communication', 'Explanation':'Communication',
  'Jargon Avoidance':'Communication', 'Understanding':'Communication', 'Closing':'Professionalism',
  'Empathy':'Empathy', 'Consent':'Consent',
};
function applyOsceToCompetencies(p, station, domainScores, overall){
  p.domains = p.domains || {};
  const bump = (name, value) => { const cur = p.domains[name]; p.domains[name] = (cur===undefined||cur===null) ? value : Math.round((cur+value)/2); };
  Object.entries(domainScores).forEach(([stationDomain, score10]) => {
    const competency = STATION_DOMAIN_TO_COMPETENCY[stationDomain];
    if (competency) bump(competency, score10*10);
  });
  // A couple of stations specifically exercise competencies no generic
  // station domain maps to — credit them directly when relevant.
  if (station.id === 'confidentiality') bump('Confidentiality', overall);
  if (station.id === 'shared-decision' || station.id === 'consent-lp') bump('Patient Autonomy', overall);
  const assessed = Object.entries(p.domains).filter(([,v]) => v!==null && v!==undefined);
  p.mostConsistentWeakness = assessed.length ? assessed.slice().sort((a,b)=>a[1]-b[1])[0][0] : null;
  p.bestImprovement = assessed.length ? assessed.slice().sort((a,b)=>b[1]-a[1])[0][0] : null;
}

function progressBar(value, cls){ return `<div class="progress-track"><div class="progress-fill ${cls||''}" style="width:${pct(value)}%"></div></div>`; }
function trendChartSVG(points, w, h){
  w=w||280; h=h||90;
  const max=100, min=0;
  const stepX = w/(points.length-1||1);
  const coords = points.map((p,i)=>[i*stepX, h-((p-min)/(max-min))*h]);
  const path = coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="var(--primary)"/>`).join('');
  return `<svg class="trend-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="var(--primary)" stroke-width="2.5"/>${dots}</svg>`;
}

  const progs = subs.map(s=>getSubjectProgress(s.id));
  const avgProgress = Math.round(progs.reduce((a,p)=>a+p.overallProgress,0)/progs.length);
  const avgScore = Math.round(progs.reduce((a,p)=>a+p.averageScore,0)/progs.length);
  const totalQ = progs.reduce((a,p)=>a+p.questionsAttempted,0);
  const totalMock = progs.reduce((a,p)=>a+p.mockTests,0);
  const totalFlash = progs.reduce((a,p)=>a+p.flashcardsCompleted,0);
  const totalCases = progs.reduce((a,p)=>a+p.clinicalCases,0);
  return { avgProgress, avgScore, totalQ, totalMock, totalFlash, totalCases, streak: calculateStreak() };
}

/* =============================================================
   READING PROGRESS (simulated "actually read this chapter")
   Opening a topic starts a short animated reading-progress bar;
   when it completes, the topic's real mastery % is bumped and
   persisted — once per topic per day, so refreshing the page
   can't be used to inflate progress. This is a deliberately
   simple, honest stand-in for real engagement tracking (time on
   page, scroll depth, etc.) — see the AI-ENGINE note style used
   elsewhere in this file: swap this for real analytics later.
   ============================================================= */
const READING_PROGRESS_DURATION_MS = 8000;
const READING_PROGRESS_TICK_MS = 200;
let readingProgressTimer = null;
let readingProgressPct = 0;
let readingTopicKey = null;

function stopReadingProgress(){
  if (readingProgressTimer){ clearInterval(readingProgressTimer); readingProgressTimer = null; }
  readingProgressPct = 0;
}
function startReadingProgress(subjectId, topic){
  stopReadingProgress();
  const step = 100 / (READING_PROGRESS_DURATION_MS / READING_PROGRESS_TICK_MS);
  readingProgressTimer = setInterval(() => {
    readingProgressPct = Math.min(100, readingProgressPct + step);
    const fill = document.getElementById('reading-progress-fill');
    const label = document.getElementById('reading-progress-label');
    if (fill) fill.style.width = readingProgressPct + '%';
    if (label) label.textContent = Math.round(readingProgressPct) + '%';
    if (readingProgressPct >= 100){
      clearInterval(readingProgressTimer); readingProgressTimer = null;
      completeReadingProgress(subjectId, topic);
    }
  }, READING_PROGRESS_TICK_MS);
}
/* The actual state mutation — separated from the timer so it can be
   called directly (e.g. by a test, or a future "mark as read" button)
   without waiting for the animation. */
function recordTopicRead(subjectId, topic){
  const p = getSubjectProgress(subjectId);
  if (p.topicProgress[topic] === undefined) return { boosted:false, delta:0, newValue:null };
  p.topicReadDates = p.topicReadDates || {};
  const today = new Date().toISOString().slice(0,10);
  const alreadyToday = p.topicReadDates[topic] === today;
  if (alreadyToday) return { boosted:false, delta:0, newValue:p.topicProgress[topic] };
  const current = p.topicProgress[topic];
  // smaller boosts as mastery gets higher — reading alone can't carry a topic all the way to 100
  const delta = current < 60 ? (6 + Math.floor(Math.random()*5)) : current < 85 ? (3 + Math.floor(Math.random()*4)) : (1 + Math.floor(Math.random()*3));
  p.topicProgress[topic] = pct(current + delta);
  p.topicReadDates[topic] = today;
  const vals = Object.values(p.topicProgress);
  p.overallProgress = pct(vals.reduce((a,b)=>a+b,0)/vals.length);
  p.topicsCompleted = Math.round((p.overallProgress/100) * p.totalTopics);
  saveState();
  return { boosted:true, delta, newValue:p.topicProgress[topic] };
}
function completeReadingProgress(subjectId, topic){
  const result = recordTopicRead(subjectId, topic);
  if (result.boosted) recordActivity();
  const card = document.getElementById('reading-progress-card');
  if (card){
    card.innerHTML = result.boosted
      ? `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
           <span style="color:var(--teal);font-weight:600;font-size:.86rem;">✓ Marked as read — mastery +${result.delta}%</span>
           <span style="font-size:.8rem;color:var(--ink-soft);">${result.newValue}% mastery now</span>
         </div>`
      : `<div style="font-size:.86rem;color:var(--ink-soft);">✓ Already counted for today — come back tomorrow for more reading progress on this topic.</div>`;
  }
  if (result.newValue !== null){
    const label = document.getElementById('topic-mastery-label');
    if (label) label.textContent = result.newValue + '% mastery';
  }
}
function topicConcept(subj, topic, level){
  const flavor = {
    'Beginner': `Think of ${topic} in the simplest terms first — the "what" and "why" before the details.`,
    'MBBS level': `At MBBS level, ${topic} is usually tested through its classical features, mechanisms and standard exceptions.`,
    'Exam-focused (NEET-PG)': `For NEET-PG, focus on the single most commonly asked fact about ${topic} and the clinical correlations examiners love to test.`,
    'Clinical application': `Clinically, ${topic} matters because it changes how you examine, investigate or manage a real patient.`,
  };
  return {
    explanation: `${flavor[level]} ${topic} is a core topic within ${subj.name}, and understanding it well builds the foundation for the more advanced topics that follow.`,
    keyPoints: [`Definition and scope of ${topic}`,`Most commonly tested feature of ${topic}`,`Key exception or classical differential`,`How ${topic} links to neighbouring topics in ${subj.name}`],
    structures: `The structures/concepts most associated with ${topic} — connect your textbook (see Admin → Textbooks) to have these pulled automatically from source material with page references.`,
    clinical: `${topic} shows up in clinical practice through the history, examination findings or investigations you'll rely on as a junior doctor — recognising it quickly is what separates a confident intern from a hesitant one.`,
    examPoints: `Examiners repeatedly test the single most classical association of ${topic} — make sure you can state it in one sentence before moving on.`,
    memoryAid: `Mnemonic-style tip: anchor ${topic} to one vivid clinical image or patient story rather than a list of facts — it will stick far longer.`,
    mistakes: `A common mistake is confusing ${topic} with a superficially similar neighbouring topic in ${subj.name} — always double-check the distinguishing feature.`,
  };
}

    <div class="quiz-options">${q.options.map((opt,i)=>`<button class="quiz-option" id="qopt-${i}" onclick="answerQuiz(${i})" ${UI.quiz.answered?'disabled':''}>${esc(opt)}</button>`).join('')}</div>
    <div id="quiz-explain-slot"></div>
  </div>`;
}
function answerQuiz(i){
  const quiz=UI.quiz; if (quiz.answered) return;
  quiz.answered=true; quiz.selected=i; const correct=quiz.current.correct;
  if (i===correct) quiz.correctCount++;
  document.querySelectorAll('.quiz-option').forEach((btn,idx)=>{ btn.disabled=true; if (idx===correct) btn.classList.add('correct'); else if (idx===i) btn.classList.add('incorrect'); });
  const wrongNote = i!==correct ? `<p style="margin-top:8px;">You chose "<b>${esc(quiz.current.options[i])}</b>" — this doesn't match the classical feature being tested here.</p>` : '';
  document.getElementById('quiz-explain-slot').innerHTML = `<div class="quiz-explain"><b>${i===correct?'Correct.':'Not quite.'}</b> ${esc(quiz.current.why)}${wrongNote}
    <div style="margin-top:14px;"><button class="btn primary small" onclick="nextQuizQuestion()">${quiz.index+1<quiz.total?'Next question':'Finish'}</button></div></div>`;
  recordMCQAttempt(quiz.subject, quiz.current.topic, i===correct);
}
function nextQuizQuestion(){
  const quiz=UI.quiz; quiz.index++;
  if (quiz.index>=quiz.total){
    // remember this session's question ids so the next "Practise again" avoids repeating them
    const sessionKey = quiz.subject + '|' + (quiz.topic||'');
    STATE.lastMCQSessionIds = STATE.lastMCQSessionIds || {};
    STATE.lastMCQSessionIds[sessionKey] = quiz.questions.map(q=>q.id);
    saveState();
    const score=Math.round((quiz.correctCount/quiz.total)*100); UI.quiz=null;
    document.getElementById('practice-body').innerHTML = `<div class="card" style="padding:26px;max-width:520px;">
      <h2>Session complete</h2><p style="margin:10px 0;">You scored <b>${quiz.correctCount}/${quiz.total}</b> (${score}%).</p>${progressBar(score)}
      <div style="margin-top:18px;display:flex;gap:10px;"><button class="btn primary" onclick="setPracticeTab('mcq')">Practise again</button><button class="btn" onclick="goRoute('track')">View progress</button></div></div>`;
    return;
  }
  quiz.current = quiz.questions[quiz.index];
  quiz.answered=false; quiz.selected=null;
  document.getElementById('practice-body').innerHTML = renderQuiz();
}
function recordMCQAttempt(subjectId, topic, correct){
  updateSubjectProgress(subjectId, p => {
    p.questionsAttempted++;
    if (topic && p.topicProgress[topic]!==undefined) p.topicProgress[topic] = pct(p.topicProgress[topic] + (correct?2:-1));
    p.averageScore = pct(p.averageScore + (correct?0.4:-0.3));
    p.attempts = [...p.attempts.slice(1), p.averageScore];
  });
  recordActivity();
}

function tickMockTimer(){

function formatTime(sec){ sec=Math.max(0,sec); const m=Math.floor(sec/60), s=sec%60; return `${m}:${s.toString().padStart(2,'0')}`; }
function renderMockTest(){
  const m = UI.mock;

function selectMockAnswer(i){ UI.mock.answers[UI.mock.index]=i; document.getElementById('practice-body').innerHTML = renderMockTest(); }
function toggleMarkReview(){ UI.mock.marked[UI.mock.index] = !UI.mock.marked[UI.mock.index]; document.getElementById('practice-body').innerHTML = renderMockTest(); }
function mockNav(delta){ UI.mock.index = Math.max(0, Math.min(UI.mock.questions.length-1, UI.mock.index+delta)); document.getElementById('practice-body').innerHTML = renderMockTest(); }
function jumpMock(i){ UI.mock.index=i; document.getElementById('practice-body').innerHTML = renderMockTest(); }
function submitMock(){
  const m=UI.mock; if (m.submitted) return; m.submitted=true;
  if (m.timerId) clearInterval(m.timerId);
  const total = m.questions.length;
  let correct=0, incorrect=0, unanswered=0;
  const topicTally = {};
  m.questions.forEach((q,i)=>{
    const ans = m.answers[i];
    if (!topicTally[q.topic]) topicTally[q.topic] = {correct:0,total:0};
    topicTally[q.topic].total++;
    if (ans===null) unanswered++;
    else if (ans===q.correct){ correct++; topicTally[q.topic].correct++; }
    else incorrect++;
  });
  const score = Math.round((correct/total)*100);
  const timeTaken = (total*45) - m.timeLeft;
  updateSubjectProgress(m.subject, p=>{
    p.mockTests++; p.questionsAttempted += total;
    p.averageScore = pct((p.averageScore + score)/2);
    p.attempts = [...p.attempts.slice(1), score];
    Object.entries(topicTally).forEach(([t,v])=>{ if (p.topicProgress[t]!==undefined && v.total){ p.topicProgress[t] = pct((p.topicProgress[t] + Math.round((v.correct/v.total)*100))/2); } });
  });
  recordActivity();
  const weakTopics = Object.entries(topicTally).filter(([t,v])=>v.total && (v.correct/v.total)<0.6).map(([t])=>t);
  const bodyEl = document.getElementById('practice-body');
  if (!bodyEl) return; // student navigated away before the timer ran out; progress above is already saved
  bodyEl.innerHTML = `
  <div class="card" style="padding:26px;max-width:640px;">
    <h2>SCORE</h2>
    <div style="font-family:var(--display);font-size:2.2rem;font-weight:700;color:var(--primary);margin-top:6px;">${score}/100</div>
    <div class="grid stat-row" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin-top:16px;">
      <div class="card stat-card"><div class="num">${correct}</div><div class="lbl">Correct</div></div>
      <div class="card stat-card"><div class="num">${incorrect}</div><div class="lbl">Incorrect</div></div>
      <div class="card stat-card"><div class="num">${unanswered}</div><div class="lbl">Unanswered</div></div>
      <div class="card stat-card"><div class="num">${score}%</div><div class="lbl">Accuracy</div></div>
      <div class="card stat-card"><div class="num">${formatTime(timeTaken)}</div><div class="lbl">Time taken</div></div>
    </div>
    <hr class="hairline">
    <h3 class="section-title">Performance analysis</h3>
    ${Object.entries(topicTally).map(([t,v])=>{ const p=v.total?Math.round((v.correct/v.total)*100):0; return `<div class="domain-bar-row"><div class="lbl">${esc(t)}</div><div class="track">${progressBar(p, p<50?'coral':(p<70?'gold':'success'))}</div><div class="score">${p}%</div></div>`; }).join('')}
    <h3 class="section-title" style="margin-top:14px;">Weak topics</h3>
    <div class="reco-list">${weakTopics.length ? weakTopics.map(t=>`<div class="reco-item"><span class="arrow">→</span><span>${esc(t)}</span></div>`).join('') : `<p class="empty-note">No clearly weak topics this attempt — nice work.</p>`}</div>
    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn primary" onclick="setPracticeTab('mocktest')">Take another mock test</button>
      <button class="btn" onclick="goRoute('track')">View full progress report</button>
    </div>
  </div>`;
}

function tickOsceTimer(){
  const s = UI.osceSession; if (!s || s.mode!=='osce' || s.finished) return;
  s.timerId = setInterval(()=>{
    if (!UI.osceSession || UI.osceSession.finished){ clearInterval(s.timerId); return; }

function routeTutorMessage(text, context){
  const t = text.toLowerCase();

  // If the student is actively referencing one of their uploaded PDFs
  // (via Upload → Ask AI), search its extracted text first — and stay
  // strictly within it, rather than silently falling back to the
  // built-in subject content. See "UPLOAD-GROUNDED CONTENT GENERATION".
  if (UI.activeUploadId){
    const u = STATE.uploads.find(x=>x.id===UI.activeUploadId);
    if (u && u.textAvailable){
      const hits = askUploadQuestion(u, text);
      if (hits && hits.length){
        return `<b>From "${esc(u.name)}":</b><br>` +
          hits.map(s=>`<div class="card" style="padding:10px 13px;margin-top:6px;font-size:.88rem;">${esc(s)}</div>`).join('') +
          `<p class="empty-note" style="margin-top:8px;">Matched by keyword search over the text extracted from your file — connect a real embeddings-based retrieval step for better matches.</p>`;
      }
      return `This information is not available in "${esc(u.name)}". Try rephrasing, or clear the reference (✕ above) to ask about ${esc(getSubject(context.subject).name)} generally.`;
    }
  }

  const subjectMentioned = allSubjects().find(s=>t.includes(s.name.toLowerCase()));
  const topicMentioned = extractTopicMention(t);
  const mcqCountMatch = t.match(/(\d+)\s*(questions?|mcqs?)/);
  let html;
  if (t.includes('test me') || (mcqCountMatch && !t.includes('case'))){
    const subj = subjectMentioned || getSubject(context.subject);
    const count = mcqCountMatch ? Math.min(10, parseInt(mcqCountMatch[1],10)) : 5;
    html = `Sure — here's ${count} question${count>1?'s':''} on <b>${esc(subj.name)}</b>. Let's start:<br><br>` + renderInlineQuestion(subj.id, topicMentioned, count);
  } else if (t.includes('summarise') || t.includes('summarize')){
    html = generateSummary(context.subject, topicMentioned || 'the last chapter you uploaded');
  } else if (t.includes('explain this pdf') || t.includes('explain the pdf')){
    const upload = STATE.uploads.filter(u=>u.subject===context.subject).slice(-1)[0];
    html = upload ? `Using <b>${esc(upload.name)}</b> as context: ${generateSummary(context.subject, upload.name)}` : `You haven't uploaded any study material for ${esc(getSubject(context.subject).name)} yet — head to <b>Upload</b> to add a PDF first.`;
  } else if (t.includes('case') && (t.includes('give')||t.includes('difficult'))){
    const subj = subjectMentioned || getSubject(context.subject);
    const c = generateClinicalCase(subj.id, topicMentioned);
    html = `Here's a case for <b>${esc(subj.name)}</b>:<br><br><i>${esc(c.vignette)}</i><br><br>Head to <b>Practice → Clinical Case</b> to work through it step by step, or ask me to walk through the reasoning here.`;
  } else if (t.includes('viva')){
    const subj = subjectMentioned || getSubject(context.subject);
    const vq = generateVivaQuestions(subj.id, topicMentioned, 1)[0];
    html = `Viva question on <b>${esc(subj.name)}</b>:<br><br>${esc(vq.q)}<br><br>Head to <b>Practice → Viva</b> to submit a written answer and get it evaluated.`;
  } else if (t.includes('act as') && (t.includes('patient')||t.includes('angry'))){
    html = `Let's role-play. I'll act as a patient — head to <b>Practice → AI Patient</b> (or a <b>Prepare</b> OSCE station) and start typing; I'll respond in character, including getting frustrated if you rush or use jargon without explaining.`;
  } else if (t.includes('weak area') || t.includes('weak areas')){
    const weak = calculateWeakAreas(context.subject, 2);
    html = `In <b>${esc(getSubject(context.subject).name)}</b>, your weakest areas right now are <b>${esc(weak.join(', '))}</b>. Want me to line up 10 MCQs or a flashcard deck on ${esc(weak[0])}?`;
  } else if (t.includes('start a mock test') || t.includes('mock test')){
    html = `Opening a mock test for <b>${esc(getSubject(context.subject).name)}</b>.`;
    setTimeout(()=>{ goRoute('practice'); setPracticeTab('mocktest'); }, 300);
  } else if (t.includes('pg') || t.includes('neet-pg') || t.includes('ini-cet')){
    const subj = subjectMentioned || getSubject(context.subject);
    html = `Here's a tougher, exam-style question on <b>${esc(subj.name)}</b>:<br><br>` + renderInlineQuestion(subj.id, topicMentioned, 1, 'NEET-PG');
  } else if (t.startsWith('explain') || t.includes('simply') || t.includes('mbbs level') || t.includes('for neet-pg')){
    let level = 'MBBS level';
    if (t.includes('simply') || t.includes('simple')) level='Beginner';
    if (t.includes('neet-pg')) level='Exam-focused (NEET-PG)';
    if (t.includes('clinical')) level='Clinical application';
    const topicGuess = topicMentioned || context.topic || (getSubject(context.subject).topics[0] && getSubject(context.subject).topics[0].name);
    const subj = subjectMentioned || getSubject(context.subject);
    const concept = topicConcept(subj, topicGuess, level);
    html = `<b>${esc(topicGuess)}</b> (${level}):<br>${concept.explanation}<br><br><b>Key points:</b><ul style="margin:6px 0 0 18px;">${concept.keyPoints.map(k=>`<li>${esc(k)}</li>`).join('')}</ul>`;
  } else {
    const weak = calculateWeakAreas(context.subject, 1);
    html = `Based on your recent progress in <b>${esc(getSubject(context.subject).name)}</b>, your weakest area is <b>${esc(weak[0])}</b>. Want me to line that up? You can also ask me to "explain", "test me", "give me a case", "give me viva questions", or "act as a patient".`;
  }
  return html;
}
function extractTopicMention(t){
  for (const subj of allSubjects()){ for (const topic of subj.topics){ if (t.includes(topic.name.toLowerCase())) return topic.name; for (const sub of topic.subtopics){ if (t.includes(sub.toLowerCase())) return sub==='Brachial Plexus'?'Upper Limb':topic.name; } } }
  return null;
}

/* =============================================================
   VOICE ASSISTANT (Web Speech API)
   ============================================================= */
let recognition = null;
let voiceTargetInput = null;

/* Web Speech API's SpeechRecognition requires a "secure context" —
   https, or localhost. Opening this file directly by double-clicking
   it (file://) does NOT count, and Chrome will refuse to run
   recognition at all in that case. This is the single most common
   reason voice input silently does nothing for someone testing a
   downloaded HTML file, so we check for it up front and say so
   plainly instead of letting the API fail with an unhelpful error. */
function isSecureEnoughForVoice(){
  if (location.protocol === 'https:') return true;
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return true;
  return false;
}
function voiceErrorMessage(code){
  switch(code){
    case 'not-allowed':
    case 'permission-denied':
      return 'Microphone access was blocked. Click the 🔒/ⓘ icon in your browser\'s address bar, allow microphone access for this page, then try again.';
    case 'no-speech':
      return 'I didn\'t hear anything — try again and speak right after tapping the mic.';
    case 'audio-capture':
      return 'No microphone was found. Check that one is connected and not in use by another app, then try again.';
    case 'network':
      return 'Voice recognition needs an internet connection to work — check your connection and try again.';
    case 'service-not-allowed':
      return 'Your browser blocked voice recognition on this page. This usually happens when the page is opened directly as a file — try opening it from a real web address (http/https) instead.';
    case 'aborted':
      return null; // student cancelled on purpose — no error needed
    default:
      return 'Voice input didn\'t work this time (' + (code||'unknown error') + ') — try again, or type your question instead.';
  }
}
/* Shows the message where the student is actually looking: as a
   system line in whichever chat log is active, rather than a
   disruptive alert() popup for every failed attempt. */
function reportVoiceIssue(targetInputId, message){
  if (!message) return;
  if (targetInputId === 'tutor-input' && document.getElementById('tutor-log')){
    appendTutorMsg('system', esc(message));
  } else if (targetInputId === 'chat-input' && document.getElementById('chat-log')){
    appendChatMsg('system', message);
  } else {
    alert(message);
  }
}
function getRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  if (!recognition){
    recognition = new SR();
    recognition.lang = 'en-US'; recognition.interimResults = false; recognition.maxAlternatives = 1;
    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      if (voiceTargetInput){ const el = document.getElementById(voiceTargetInput); if (el){ el.value = transcript; if (voiceTargetInput==='tutor-input') sendTutorInput(); else if (voiceTargetInput==='chat-input') sendOsceMessage(); } }
      stopVoice();
    };
    recognition.onerror = (e) => {
      const target = voiceTargetInput;
      stopVoice();
      reportVoiceIssue(target, voiceErrorMessage(e && e.error));
    };
    recognition.onend = () => stopVoice();
  }
  return recognition;
}
function stopVoice(){
  document.querySelectorAll('.mic-btn, #voiceFab, .tutor-chip.voice').forEach(b=>b.classList.remove('listening'));
  voiceTargetInput = null;
  try{ recognition && recognition.stop(); }catch(e){}
}
function toggleVoiceInput(targetInputId){
  if (!isSecureEnoughForVoice()){
    reportVoiceIssue(targetInputId, voiceErrorMessage('service-not-allowed'));
    return;
  }
  const rec = getRecognition();
  if (!rec){ alert('Voice input is not supported in this browser. Try Chrome on desktop or Android.'); return; }
  if (voiceTargetInput === targetInputId){ stopVoice(); return; }
  voiceTargetInput = targetInputId;
  document.querySelectorAll('.mic-btn, #voiceFab, .tutor-chip.voice').forEach(b=>b.classList.remove('listening'));
  const btn = targetInputId==='tutor-input' ? document.getElementById('tutorMicBtn') : targetInputId==='chat-input' ? document.getElementById('chatMicBtn') : document.getElementById('voiceFab');
  if (btn) btn.classList.add('listening');
  if (targetInputId==='tutor-input'){ const chip = document.getElementById('tutorVoiceChip'); if (chip) chip.classList.add('listening'); }
  try{
    rec.start();
  }catch(e){
    // e.g. InvalidStateError if recognition was already active — reset and surface it rather than failing silently
    stopVoice();
    reportVoiceIssue(targetInputId, 'Voice input couldn\'t start — please try tapping the mic again.');
  }
}
function speakText(text){
  if (!('speechSynthesis' in window)){ alert('Text-to-speech is not supported in this browser.'); return; }
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1; window.speechSynthesis.cancel(); window.speechSynthesis.speak(utter);

function voiceFabClicked(){

  if (UI.route !== 'tutor') goRoute('tutor');
