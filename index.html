}

/* =============================================================
   UPLOAD TEXT EXTRACTION (client-side, via pdf.js)

   Nothing here ever sends the file anywhere — extraction happens
   entirely in the browser tab. This is a heuristic stand-in for a
   real ingestion pipeline (see the architecture notes discussed
   earlier): a production system would OCR-detect low-quality scans,
   chunk with real metadata, and index into a proper vector store
   instead of keeping one big string in localStorage.
   ============================================================= */
async function extractPdfText(file){
  if (typeof pdfjsLib === 'undefined'){
    throw new Error('The PDF reading library did not load (check your internet connection) — try again, or use a different browser.');
  }
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pageCount = pdf.numPages;
  const pagesToRead = Math.min(pageCount, PDF_MAX_PAGES);
  let text = '';
  for (let i = 1; i <= pagesToRead; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const pageText = content.items.map(it => it.str).join(' ');
    text += pageText + '\n\n';
    if (text.length > PDF_TEXT_CHAR_CAP) break;
  }
  const truncated = text.length > PDF_TEXT_CHAR_CAP || pagesToRead < pageCount;
  text = text.slice(0, PDF_TEXT_CHAR_CAP).trim();
  return { text, pageCount, pagesRead: pagesToRead, truncated };
}

/* =============================================================
   UPLOAD-GROUNDED CONTENT GENERATION
   Heuristic, offline stand-ins for generateSummary()/generateFlashcards()/
   generateMCQs()/RAG-retrieval specifically when the source is a
   student's own uploaded file rather than the curated subject banks.
   Everything here is extracted or lightly transformed from the
   file's own text — nothing is invented.
   ============================================================= */
const STOPWORDS = new Set(['the','and','of','a','an','to','in','is','are','was','were','for','on','with','as','by','that','this','it','be','or','at','from','which','these','those','their','its','also','can','may','not','but','than','then','into','such','more','most','other','you','your','have','has','will','into','over','under','they','them']);

function splitSentences(text){
  return text.replace(/\s+/g,' ').trim()
    .split(/(?<=[.?!])\s+(?=[A-Z0-9])/)
    .map(s=>s.trim())
    .filter(s=>s.length>25 && s.length<300);
}

function scoreSentencesByKeyword(sentences){
  const freq = {};
  sentences.forEach(s => {
    s.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).forEach(w => {
      if (w.length>3 && !STOPWORDS.has(w)) freq[w] = (freq[w]||0)+1;
    });
  });
  return sentences.map(s => {
    const words = s.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(Boolean);
    const score = words.length ? words.reduce((a,w)=>a+(freq[w]||0),0) / words.length : 0;
    return { sentence:s, score };
  });
}

/* Extractive "summary": ranks sentences by keyword frequency, then
   restores original order for readability. Nothing is rewritten —
   every line is a sentence lifted directly from the file. */
function summarizeUploadText(upload, count){
  count = count || 6;
  const sentences = splitSentences(upload.extractedText);
  if (!sentences.length) return null;
  const ranked = scoreSentencesByKeyword(sentences).sort((a,b)=>b.score-a.score).slice(0,count).map(r=>r.sentence);
  return sentences.filter(s => ranked.includes(s));
}

/* Cloze-style flashcards built directly from extracted sentences:
   a capitalized term is blanked out; the "back" is that term plus
   the original sentence for context. Each card's source sentence is
   used at most once per call, and options.excludeCardIds lets a
   caller avoid repeating cards already shown in a previous deck from
   the same file. */
function generateFlashcardsFromUpload(upload, count, options){
  options = options || {};
  count = count || 6;
  const excludeIds = new Set(options.excludeCardIds||[]);
  const sentences = splitSentences(upload.extractedText);
  const cards = [];
  const usedSentences = new Set();
  let attempts = 0;
  while (cards.length < count && attempts < sentences.length * 3 && sentences.length){
    attempts++;
    const s = sentences[Math.floor(Math.random()*sentences.length)];
    if (usedSentences.has(s)) continue;
    const words = s.split(/\s+/);
    const candidates = words.filter((w,i) => i>0 && /^[A-Z][a-zA-Z\-]{3,}$/.test(w.replace(/[.,;:()]$/,'')));
    if (!candidates.length) continue;
    const rawTerm = candidates[Math.floor(Math.random()*candidates.length)];
    const term = rawTerm.replace(/[.,;:()]$/,'');
    const blanked = s.replace(rawTerm, '_____');
    const id = makeFlashcardId(upload.id, upload.name, blanked, term);
    usedSentences.add(s); // this source sentence is spent either way — never reused for another card
    if (excludeIds.has(id)) continue;
    cards.push({ id, topic: upload.name, front: blanked, back: term, context: s });
  }
  return cards;
}

/* MCQs built the same cloze way, with distractors drawn from other
   extracted terms in the same file (never invented facts). */
function generateMCQFromUpload(upload, count){
  count = count || 5;
  const pool = generateFlashcardsFromUpload(upload, count*3);
  if (!pool.length) return [];
  const allTerms = [...new Set(pool.map(c=>c.back))];
  return pool.slice(0, count).map(c => {
    let distractors = allTerms.filter(term => term !== c.back).sort(()=>Math.random()-0.5).slice(0,3);
    while (distractors.length < 3) distractors.push('None of the above');
    const options = [c.back, ...distractors].sort(()=>Math.random()-0.5);
    return {
      id: c.id, topic: upload.name,
      stem: c.front,
      options,
      correct: options.indexOf(c.back),
      why: `Extracted directly from "${upload.name}": "${c.context}"`,
    };
  });
}

/* Tiny keyword-overlap "retrieval" used by the tutor's Ask-AI mode
   when a specific upload is being referenced. A real system would
   use embeddings + a vector index instead of substring matching. */
function askUploadQuestion(upload, question){
  const sentences = splitSentences(upload.extractedText);
  if (!sentences.length) return null;
  const qWords = question.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(w=>w.length>3 && !STOPWORDS.has(w));
  if (!qWords.length) return null;
  const scored = sentences.map(s => {
    const wordSet = new Set(s.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(Boolean));
    const hits = qWords.filter(w=>wordSet.has(w)).length; // whole-word match only — substring matching let "tell" spuriously match inside "patella"
    return { s, hits };
  }).filter(r=>r.hits>0).sort((a,b)=>b.hits-a.hits);
  return scored.length ? scored.slice(0,3).map(r=>r.s) : null;
}

/* =============================================================
   FEEDBACK / POINTS / LEADERBOARD ENGINE

   Data model: STATE.feedback is the single source of truth. Points
   are always derived by summing feedback[].pointsAwarded for a
   student/college rather than kept in a separate counter, so there
   is never a sync bug between "points shown" and "feedback stored".
   STATE.students is a directory of every profile that has ever
   logged in on this browser (keyed by lowercased email) — since this
   is a frontend-only localStorage prototype there is no real
   multi-user backend yet, so "real users" means real accounts that
   have actually been used here, never randomly generated ones.
   ============================================================= */
const FEEDBACK_CATEGORIES = ['Question/MCQ Issue','Flashcard Issue','Content/Medical Information Issue','AI Tutor Issue','Technical/Bug Issue','UI/Design Suggestion','Feature Request','Other'];
const FEEDBACK_DAILY_POINT_CAP = 50;
const FEEDBACK_ACCEPT_BONUS = 25;

function currentStudentId(){ return (STATE.auth.profile && STATE.auth.profile.email) ? STATE.auth.profile.email.toLowerCase() : null; }
function registerStudentInDirectory(profile){
  if (!profile || !profile.email) return;
  const id = profile.email.toLowerCase();
  STATE.students = STATE.students || {};
  const existing = STATE.students[id];
  STATE.students[id] = {
    id, name: profile.name||'', email: profile.email,
    university: profile.university||'', college: profile.college||'', year: profile.year||'',
    createdAt: (existing && existing.createdAt) || new Date().toISOString(),
  };
  saveState();
}

function normalizeFeedbackText(t){ return (t||'').toLowerCase().trim().replace(/\s+/g,' '); }
function isDuplicateFeedbackSubmission(studentId, text){
  const norm = normalizeFeedbackText(text);
  return (STATE.feedback||[]).some(f => f.studentId===studentId && normalizeFeedbackText(f.text)===norm);
}
function studentPointsEarnedToday(studentId){
  const today = new Date().toISOString().slice(0,10);
  return (STATE.feedback||[]).filter(f => f.studentId===studentId && (f.createdAt||'').slice(0,10)===today)
    .reduce((a,f)=>a+(f.pointsAwarded||0), 0);
}
/* Simple, explainable quality heuristic (CHANGE 12) — a real backend
   could later replace this with a proper NLP classifier, but the
   shape (category/subject/topic/rating/text -> a point value) stays
   the same. */
function calculateFeedbackPoints(fb){
  const text = (fb.text||'').trim();
  if (text.length < 10) return 0; // too short to be useful — no points
  const actionable = /\b(should|please|repeat|repeated|duplicate|error|incorrect|wrong|suggest|instead|missing|clarify|fix|expected|confusing)\b/i.test(text);
  const detailed = text.length >= 80;
  const hasRatingAndExplanation = !!fb.rating && text.length >= 20;
  let points = 10; // baseline valid feedback
  if (detailed && actionable) points = 15;
  else if (detailed || actionable) points = 12;
  if (hasRatingAndExplanation) points = Math.max(points, 12);
  return points;
}
/* CHANGE 3/4 — submits one feedback item, applying the point/anti-spam
   rules, and returns the stored feedback object (or null if the
   student isn't logged in). */
function submitFeedback({ category, subject, topic, text, rating, recommend }){
  const studentId = currentStudentId();
  if (!studentId) { alert('Please log in to submit feedback.'); return null; }
  const prof = STATE.auth.profile;
  const duplicate = isDuplicateFeedbackSubmission(studentId, text);
  let points = duplicate ? 0 : calculateFeedbackPoints({ category, text, rating, recommend });
  if (!duplicate && points > 0){
    const remaining = Math.max(0, FEEDBACK_DAILY_POINT_CAP - studentPointsEarnedToday(studentId));
    points = Math.min(points, remaining);
  }
  const fb = {
    id: 'fb_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    studentId, studentName: prof.name||'', college: prof.college||'', university: prof.university||'', year: prof.year||'',
    category, subject: subject||'', topic: topic||'',
    text, rating: rating||null, recommend: (recommend===true||recommend===false) ? recommend : null,
    pointsAwarded: points, bonusAwarded: false,
    status: 'Pending', createdAt: new Date().toISOString(),
  };
  STATE.feedback = STATE.feedback || [];
  STATE.feedback.push(fb);
  saveState();
  return fb;
}
/* CHANGE 11 — admin actions. acceptFeedback() awards the accepted-
   feedback bonus exactly once, guarded by bonusAwarded, so clicking
   Accept repeatedly can never double-award points. */
function acceptFeedback(feedbackId){
  const fb = (STATE.feedback||[]).find(f=>f.id===feedbackId);
  if (!fb) return;
  fb.status = 'Accepted';
  if (!fb.bonusAwarded){ fb.pointsAwarded = (fb.pointsAwarded||0) + FEEDBACK_ACCEPT_BONUS; fb.bonusAwarded = true; }
  saveState();
}
function rejectFeedback(feedbackId){
  const fb = (STATE.feedback||[]).find(f=>f.id===feedbackId);
  if (!fb) return;
  fb.status = 'Rejected';
  saveState();
}
function markFeedbackReviewed(feedbackId){
  const fb = (STATE.feedback||[]).find(f=>f.id===feedbackId);
  if (!fb) return;
  fb.status = 'Reviewed';
  saveState();
}

function getStudentPoints(studentId){ return (STATE.feedback||[]).filter(f=>f.studentId===studentId).reduce((a,f)=>a+(f.pointsAwarded||0),0); }
function getStudentFeedbackCount(studentId){ return (STATE.feedback||[]).filter(f=>f.studentId===studentId).length; }
function getStudentAcceptedCount(studentId){ return (STATE.feedback||[]).filter(f=>f.studentId===studentId && f.status==='Accepted').length; }

function filterFeedbackByPeriod(feedback, period){
  if (!period || period==='all') return feedback;
  const now = new Date();
  return feedback.filter(f=>{
    const d = new Date(f.createdAt);
    if (isNaN(d)) return false;
    if (period==='month') return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
    if (period==='week'){ const diffDays=(now-d)/(1000*60*60*24); return diffDays>=0 && diffDays<=7; }
    return true;
  });
}
/* CHANGE 6/19 — real-data-only leaderboards. Built entirely from
   STATE.feedback (+ STATE.students for the directory of who exists),
   never randomly generated. Sort: points desc, accepted desc,
   total feedback desc, name/college alphabetical as final tiebreak. */
function getStudentLeaderboard(period, year){
  let fb = filterFeedbackByPeriod(STATE.feedback||[], period||'all');
  if (year && year!=='all') fb = fb.filter(f=>f.year===year);
  const map = {};
  fb.forEach(f=>{
    if (!map[f.studentId]) map[f.studentId] = { studentId:f.studentId, name:f.studentName, college:f.college, university:f.university, feedbackCount:0, acceptedCount:0, points:0 };
    map[f.studentId].feedbackCount++;
    if (f.status==='Accepted') map[f.studentId].acceptedCount++;
    map[f.studentId].points += (f.pointsAwarded||0);
  });
  // The logged-in student always appears (even with zero feedback so far) so their rank always resolves.
  const me = currentStudentId();
  if (me && !map[me] && STATE.auth.profile && (!year || year==='all' || STATE.auth.profile.year===year)){
    map[me] = { studentId:me, name:STATE.auth.profile.name, college:STATE.auth.profile.college, university:STATE.auth.profile.university, feedbackCount:0, acceptedCount:0, points:0 };
  }
  const list = Object.values(map);
  list.sort((a,b)=> b.points-a.points || b.acceptedCount-a.acceptedCount || b.feedbackCount-a.feedbackCount || (a.name||'').localeCompare(b.name||''));
  list.forEach((row,i)=>row.rank=i+1);
  return list;
}
function getCollegeLeaderboard(period, year){
  let fb = filterFeedbackByPeriod(STATE.feedback||[], period||'all');
  if (year && year!=='all') fb = fb.filter(f=>f.year===year);
  const map = {};
  fb.forEach(f=>{
    const college = f.college || 'Unspecified';
    if (!map[college]) map[college] = { college, students:new Set(), feedbackCount:0, acceptedCount:0, points:0 };
    map[college].students.add(f.studentId);
    map[college].feedbackCount++;
    if (f.status==='Accepted') map[college].acceptedCount++;
    map[college].points += (f.pointsAwarded||0);
  });
  const list = Object.values(map).map(c=>({ college:c.college, studentsCount:c.students.size, feedbackCount:c.feedbackCount, acceptedCount:c.acceptedCount, points:c.points }));
  list.sort((a,b)=> b.points-a.points || b.acceptedCount-a.acceptedCount || b.feedbackCount-a.feedbackCount || a.college.localeCompare(b.college));
  list.forEach((row,i)=>row.rank=i+1);
  return list;
}
function getStudentRank(studentId, period, year){ const row=getStudentLeaderboard(period||'all', year||'all').find(r=>r.studentId===studentId); return row?row.rank:null; }
function getCollegeRank(college, period, year){ if (!college) return null; const row=getCollegeLeaderboard(period||'all', year||'all').find(r=>r.college===college); return row?row.rank:null; }

/* =============================================================
   VIEW: UPLOAD
   ============================================================= */
function renderUpload(){
  return `<div class="page-head"><div><h1>Upload My Study Material</h1><div class="sub">PDFs you upload are read in your browser (via pdf.js) — nothing is sent to a server. The extracted text powers the actions below.</div></div></div>
  <div class="card" style="padding:20px;max-width:680px;margin-bottom:24px;">
    <div class="field-row">
      <div class="field" style="flex:2;"><label>File</label><input type="file" id="upload-file" accept=".pdf"></div>
      <div class="field"><label>Subject</label><select id="upload-subject">${allSubjects().map(s=>`<option value="${s.id}" ${s.id===UI.subject?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
    </div>
    <button class="btn primary" style="margin-top:14px;" id="upload-btn" onclick="handleUpload()">Upload &amp; extract text</button>
    <p class="empty-note" style="margin-top:10px;">This demo reads up to the first ${PDF_MAX_PAGES} pages of a PDF entirely in your browser and keeps the extracted text in this browser's local storage (capped at roughly ${(PDF_TEXT_CHAR_CAP/1000).toFixed(0)}k characters per file) so the actions below can use it. A real backend would instead store the file and index it into that subject's vector database — see <code>POST /api/material/upload</code> in the architecture notes.</p>
  </div>
  <h2 class="section-title">Your uploads</h2>
  <div id="uploads-list">${STATE.uploads.length ? STATE.uploads.slice().reverse().map(u=>renderUploadRow(u)).join('') : `<p class="empty-note">No study material uploaded yet.</p>`}</div>`;
}
function renderUploadRow(u){
  const subj = getSubject(u.subject);
  const metaBits = [];
  if (u.pageCount) metaBits.push(`${u.pageCount} page${u.pageCount>1?'s':''}${u.truncated?` (first ${Math.min(u.pageCount,PDF_MAX_PAGES)} read)`:''}`);
  if (u.wordCount) metaBits.push(`${u.wordCount.toLocaleString()} words extracted`);
  const disabled = !u.textAvailable ? 'disabled' : '';
  return `<div class="upload-row">
    <div class="file-ico">📄</div>
    <div class="meta">
      <div class="name">${esc(u.name)}</div>
      <div class="sub">${esc(subj?subj.name:'—')} · Uploaded ${esc(u.date)}${metaBits.length?' · '+metaBits.map(esc).join(' · '):''}</div>
      ${u.error ? `<div class="sub" style="color:var(--coral);margin-top:2px;">${esc(u.error)}</div>` : ''}
    </div>
    <span class="status-pill ${u.status==='Processed'?'processed':'processing'}">${esc(u.status)}</span>
    <div class="upload-actions">
      <button class="btn small" onclick="materialAction('${u.id}','summarise')" ${disabled}>Summarise</button>
      <button class="btn small" onclick="materialAction('${u.id}','flashcards')" ${disabled}>Generate Flashcards</button>
      <button class="btn small" onclick="materialAction('${u.id}','mcqs')" ${disabled}>Generate MCQs</button>
      <button class="btn small" onclick="materialAction('${u.id}','ask')" ${disabled}>Ask AI</button>
      <button class="btn small" onclick="materialAction('${u.id}','revision')" ${disabled}>Generate Revision Notes</button>
    </div>
  </div>`;
}
async function handleUpload(){
  const fileInput = document.getElementById('upload-file');
  const subject = document.getElementById('upload-subject').value;
  const file = fileInput.files && fileInput.files[0];
  if (!file){ alert('Choose a PDF file first.'); return; }

  const upload = {
    id:'u'+Date.now(), name:file.name, subject, date:new Date().toLocaleDateString(),
    status:'Processing', extractedText:'', pageCount:null, wordCount:0, truncated:false,
    textAvailable:false, error:null,
  };
  STATE.uploads.push(upload);
  saveState();
  if (UI.route==='upload') renderAll();

  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  if (!isPdf){
    upload.status = 'Processed';
    upload.error = 'Only PDF text extraction is supported in this demo.';
    saveState();
    if (UI.route==='upload') renderAll();
    return;
  }

  try{
    const { text, pageCount, truncated } = await extractPdfText(file);
    upload.pageCount = pageCount;
    upload.truncated = truncated;
    if (!text || text.replace(/\s/g,'').length < 40){
      upload.status = 'Processed';
      upload.textAvailable = false;
      upload.error = 'No extractable text found — this may be a scanned/image-only PDF. Try a text-based PDF, or run OCR on it first.';
    } else {
      upload.extractedText = text;
      upload.wordCount = text.split(/\s+/).filter(Boolean).length;
      upload.textAvailable = true;
      upload.status = 'Processed';
      if (!saveState()){
        // extracted text was too large for this browser's storage quota — degrade gracefully
        upload.extractedText = '';
        upload.textAvailable = false;
        upload.error = 'The extracted text was too large to store in this browser demo. Try a shorter document, or fewer pages.';
        saveState();
      }
    }
  }catch(e){
    upload.status = 'Processed';
    upload.textAvailable = false;
    upload.error = 'Could not read this PDF (' + (e && e.message ? e.message : 'unknown error') + ').';
  }
  saveState();
  if (UI.route==='upload') renderAll();
}
function materialAction(uploadId, action){
  const u = STATE.uploads.find(x=>x.id===uploadId); if (!u) return;
  UI.subject = u.subject;
  if (action === 'ask') UI.activeUploadId = u.id;
  goRoute('tutor');

  if (!u.textAvailable){
    setTimeout(()=>appendTutorMsg('patient', `I couldn't extract usable text from "${esc(u.name)}" — ${esc(u.error||'no extractable text found.')}`), 0);
    return;
  }
  if (action === 'ask'){
    setTimeout(()=>appendTutorMsg('system', `Ask me anything about "${esc(u.name)}" (${u.pageCount||'?'} pages, ${u.wordCount.toLocaleString()} words extracted) — I'll search its text for an answer, and only its text, until you clear the reference above.`), 0);
    return;
  }
  if (action === 'summarise' || action === 'revision'){
    const picked = summarizeUploadText(u, action==='revision' ? 10 : 6);
    const title = action==='revision' ? 'Revision notes' : 'Summary';
    const html = picked
      ? `<b>${title} — ${esc(u.name)}</b>${u.truncated?`<br><span class="empty-note">(based on the first ${Math.min(u.pageCount,PDF_MAX_PAGES)} of ${u.pageCount} pages read for this demo)</span>`:''}<ul style="margin:8px 0 0 18px;">${picked.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><p class="empty-note" style="margin-top:8px;">Extractive summary — these are real sentences pulled from your file, ranked by keyword frequency, not a rewritten summary. Connect a real LLM per the architecture notes for a fully rewritten version.</p>`
      : `I couldn't find enough well-formed sentences in "${esc(u.name)}" to summarise.`;
    setTimeout(()=>appendTutorMsg('patient', html), 0);
    return;
  }
  if (action === 'flashcards'){
    const deckKey = 'upload:'+u.id;
    STATE.lastFlashDeckIds = STATE.lastFlashDeckIds || {};
    const previousIds = STATE.lastFlashDeckIds[deckKey] || [];
    const cards = generateFlashcardsFromUpload(u, 6, { excludeCardIds: previousIds });
    STATE.lastFlashDeckIds[deckKey] = cards.map(c=>c.id);
    saveState();
    const html = cards.length
      ? `<b>Flashcards from ${esc(u.name)}</b>` + cards.map((c,i)=>`<div class="card" style="padding:12px 14px;margin-top:8px;"><b>${i+1}.</b> ${esc(c.front)}<br><span class="empty-note">${esc(c.back)}</span></div>`).join('')
      : `I couldn't find enough clearly-named terms in "${esc(u.name)}" to build flashcards.`;
    setTimeout(()=>appendTutorMsg('patient', html), 0);
    return;
  }
  if (action === 'mcqs'){
    const qs = generateMCQFromUpload(u, 5);
    if (!qs.length){ setTimeout(()=>appendTutorMsg('patient', `I couldn't find enough clearly-named terms in "${esc(u.name)}" to build MCQs.`), 0); return; }
    const html = `<b>MCQs from ${esc(u.name)}</b>` + qs.map((q,i)=>renderInlineQuestionObj(q, i+1)).join('');
    setTimeout(()=>appendTutorMsg('patient', html), 0);
    return;
  }
}

   SEARCH / NOTIFICATIONS
   ============================================================= */
function runGlobalSearch(){
  const q = (document.getElementById('globalSearch').value||'').trim().toLowerCase();
  if (!q) return;
  const subjectHits = [], topicHits = [], flashHits = [], mcqHits = [], uploadHits = [];
  allSubjects().forEach(s=>{
    if (s.name.toLowerCase().includes(q)) subjectHits.push({label:s.name, action:()=>openLearnSubject(s.id)});
    s.topics.forEach(t=>{ if (t.name.toLowerCase().includes(q)) topicHits.push({label:`${s.name} → ${t.name}`, action:()=>openTopicDetail(s.id,t.name)}); });
  });
  Object.entries(FLASHCARD_BANK).forEach(([sid,cards])=>{ cards.forEach(c=>{ if (c.front.toLowerCase().includes(q) || c.topic.toLowerCase().includes(q)) flashHits.push({label:`${getSubject(sid)?getSubject(sid).name:sid} → ${c.topic}`, action:()=>{ UI.subject=sid; goRoute('practice'); setPracticeTab('flashcards'); }}); }); });
  Object.entries(MCQ_BANK).forEach(([sid,qs])=>{ qs.forEach(mq=>{ if (mq.stem.toLowerCase().includes(q) || mq.topic.toLowerCase().includes(q)) mcqHits.push({label:`${getSubject(sid)?getSubject(sid).name:sid} → ${mq.topic}`, action:()=>{ UI.subject=sid; goRoute('practice'); setPracticeTab('mcq'); }}); }); });
  STATE.uploads.forEach(u=>{ if (u.name.toLowerCase().includes(q)) uploadHits.push({label:u.name, action:()=>goRoute('upload')}); });
  openSearchModal(q, {subjectHits, topicHits, flashHits, mcqHits, uploadHits});
}
function openSearchModal(q, results){
  const groups = [['Subjects & Topics', [...results.subjectHits, ...results.topicHits]], ['My Uploaded Notes', results.uploadHits], ['Flashcards', results.flashHits], ['Questions', results.mcqHits]];
  document.getElementById('modal-root').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-box wide"><button class="modal-close" onclick="closeModal()">✕</button>
      <h2>Search results</h2><p class="empty-note" style="margin-bottom:16px;">"${esc(q)}"</p>
      ${groups.map(([label,items])=> items.length ? `<div class="search-result-group"><h4>${label}</h4>${items.map((it,i)=>`<div class="search-result-item" style="cursor:pointer;" onclick="closeModal();(${wrapAction(label,i)})()">${esc(it.label)}</div>`).join('')}</div>` : '').join('') || '<p class="empty-note">No results found.</p>'}
    </div></div>`;
  window.__searchResults = results;
}
function wrapAction(label, i){
  window.__lastSearchGroup = label; window.__lastSearchIdx = i;
  return `runSearchAction('${label.replace(/'/g,"")}', ${i})`;
}
function runSearchAction(label, i){
  const r = window.__searchResults; if (!r) return;
  const map = { 'Subjects & Topics':[...r.subjectHits, ...r.topicHits], 'My Uploaded Notes':r.uploadHits, 'Flashcards':r.flashHits, 'Questions':r.mcqHits };
  const item = (map[label]||[])[i]; if (item) item.action();
}
function pushNotification(text){ STATE.notifications.unshift({ id:'n'+Date.now(), text, read:false }); saveState(); updateNotifDot(); }
function updateNotifDot(){
  const unread = STATE.notifications.some(n=>!n.read);
  ['notifDot','notifDotMobile'].forEach(id=>{ const el=document.getElementById(id); if (el) el.style.display = unread ? 'block':'none'; });
}
function openNotifications(){
  document.getElementById('modal-root').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-box"><button class="modal-close" onclick="closeModal()">✕</button>
      <h2>Notifications</h2><p class="empty-note" style="margin-bottom:16px;">Reminders and progress updates.</p>
      ${STATE.notifications.length ? STATE.notifications.map(n=>`<div class="notif-item">${esc(n.text)}</div>`).join('') : '<p class="empty-note">You\'re all caught up.</p>'}
    </div></div>`;
  STATE.notifications.forEach(n=>n.read=true); saveState(); updateNotifDot();
}

/* =============================================================
   AUTH VIEWS
   ============================================================= */
function setAuthTab(tab){
  UI.authTab = tab;
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-signup').classList.toggle('active', tab==='signup');
  document.getElementById('auth-form-slot').innerHTML = tab==='login' ? renderLoginForm() : renderSignupForm();
}
function renderLoginForm(){
  return `<div class="field" style="margin-bottom:14px;"><label>Email ID</label><input type="email" id="login-email" placeholder="you@medcollege.edu"></div>
  <div class="field" style="margin-bottom:20px;"><label>Password</label><input type="password" id="login-password" placeholder="••••••••"></div>
  <button class="btn primary" style="width:100%;" onclick="handleLogin()">Login</button>
  <p class="empty-note" style="margin-top:14px;text-align:center;">Demo prototype — any email/password combination signs you in as a demo student, or continue with an existing account created on this device.</p>`;
}
function renderSignupForm(){
  return `<div class="field-row"><div class="field" style="margin-bottom:14px;"><label>Full Name</label><input type="text" id="su-name" placeholder="Jane Doe"></div></div>
  <div class="field" style="margin-bottom:14px;"><label>Email ID</label><input type="email" id="su-email" placeholder="you@medcollege.edu"></div>
  <div class="field" style="margin-bottom:14px;"><label>Password</label><input type="password" id="su-password" placeholder="••••••••"></div>
  <div class="field-row">
    <div class="field" style="margin-bottom:14px;"><label>University</label><input type="text" id="su-university" placeholder="e.g. University of Delhi"></div>
    <div class="field" style="margin-bottom:14px;"><label>Medical College</label><input type="text" id="su-college" placeholder="e.g. AIIMS"></div>
  </div>
  <div class="field-row">
    <div class="field" style="margin-bottom:14px;"><label>MBBS Year</label><select id="su-year">${MBBS_YEARS.map(y=>`<option>${y}</option>`).join('')}</select></div>
    <div class="field" style="margin-bottom:14px;"><label>Country</label><input type="text" id="su-country" placeholder="e.g. India"></div>
  </div>
  <div class="field" style="margin-bottom:20px;"><label>Exam Preparation (select all that apply)</label>
    <div class="chip-multiselect" id="su-exam-chips">${EXAM_TARGETS.map(e=>`<button type="button" class="chip-check" data-exam="${esc(e)}" onclick="this.classList.toggle('active')">${esc(e)}</button>`).join('')}</div>
  </div>
  <button class="btn primary" style="width:100%;" onclick="handleSignup()">Create Account</button>`;
}
function handleLogin(){
  const email = document.getElementById('login-email').value.trim() || 'student@demo.com';
  const emailKey = email.toLowerCase();
  let profile = STATE.auth.profile;
  if (!profile || profile.email !== email){
    // Prefer a previously-registered profile for this email (see registerStudentInDirectory) so returning users keep their real college/year instead of getting a generic demo profile every time.
    const known = STATE.students && STATE.students[emailKey];
    profile = known
      ? { name: known.name, email: known.email, university: known.university, college: known.college, year: known.year, country:'India', examTargets:['NEET-PG'] }
      : { name: email.split('@')[0].replace(/[.\-_]/g,' ') || 'Student', email, university:'Demo University', college:'Demo Medical College', year:'1st Year', country:'India', examTargets:['NEET-PG'] };
  }
  STATE.auth = { loggedIn:true, profile };
  saveState();
  registerStudentInDirectory(profile);
  document.body.classList.add('authed');
  goRoute('dashboard');
}
function handleSignup(){
  const name = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim();
  const password = document.getElementById('su-password').value;
  if (!name || !email || !password){ alert('Please fill in your name, email and password.'); return; }
  const university = document.getElementById('su-university').value.trim();
  const college = document.getElementById('su-college').value.trim();
  const year = document.getElementById('su-year').value;
  const country = document.getElementById('su-country').value.trim();
  const examTargets = [...document.querySelectorAll('#su-exam-chips .chip-check.active')].map(b=>b.dataset.exam);
  const profile = { name, email, university, college, year, country, examTargets: examTargets.length?examTargets:['University Examination'] };
  STATE.auth = { loggedIn:true, profile };
  saveState();
  registerStudentInDirectory(profile);
  document.body.classList.add('authed');
  goRoute('dashboard');
}
function logout(){ STATE.auth = { loggedIn:false, profile:null }; saveState(); document.body.classList.remove('authed'); goRoute('home'); }

/* =============================================================
   FEATURE GRID (home page)
   ============================================================= */
const FEATURES = [
  ['✦','AI Tutor','Learn from your study material and ask questions.'],
  ['✎','Practice','Test your knowledge with questions and clinical cases.'],
  ['▥','Flashcards','Revise important concepts quickly.'],
  ['⏱','Mock Tests','Prepare for University, NEET-PG, INI-CET and FMGE.'],
  ['🩺','AI Patient','Practise communication and clinical interactions.'],
  ['🎤','Voice Assistant','Talk to CLINOVA instead of typing.'],
  ['▤','Progress','Know exactly where you are improving and where you are weak.'],
];

/* =============================================================
   MAIN RENDER + BOOT
   ============================================================= */
function renderView(){
  switch(UI.route){
    case 'dashboard': return renderDashboard();
    case 'learn': return renderLearn();
    case 'practice': return renderPractice();
    case 'prepare': return renderPrepare();
    case 'track': return renderTrack();
    case 'tutor': return renderTutor();
    case 'upload': return renderUpload();
    case 'feedback': return renderFeedback();
    case 'leaderboard': return renderLeaderboard();
    case 'admin': return renderAdmin();
    default: return renderDashboard();
  }
}
function renderAll(){
  const authed = isLoggedIn();
  document.body.classList.toggle('authed', authed);
  document.getElementById('home-view').style.display = (!authed && UI.route==='home') ? '' : 'none';
  document.getElementById('auth-view').style.display = (!authed && (UI.route==='login'||UI.route==='signup')) ? '' : 'none';

  if (!authed){
    if (UI.route==='home'){
      const grid = document.getElementById('feature-grid');
      if (grid && !grid.dataset.built){ grid.innerHTML = FEATURES.map(f=>`<div class="card feature-card"><div class="ico">${f[0]}</div><h3>${f[1]}</h3><p>${f[2]}</p></div>`).join(''); grid.dataset.built='1'; }
    } else if (UI.route==='login' || UI.route==='signup'){
      setAuthTab(UI.route);
    }
    return;
  }

  document.getElementById('view-root').innerHTML = renderView();
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.route===UI.route));
  const prof = STATE.auth.profile || {};
  document.getElementById('sidebarName').textContent = prof.name || 'Student';
  document.getElementById('sidebarGoal').textContent = 'Target: ' + ((prof.examTargets&&prof.examTargets[0]) || '—');
  document.getElementById('avatarInitial').textContent = (prof.name||'S').charAt(0).toUpperCase();
  updateNotifDot();

  // Start/stop the simulated reading-progress timer based on whether a
  // topic detail page is actually on screen right now, keyed so an
  // incidental re-render of the same topic (e.g. switching the level
  // pill) doesn't restart progress that's already partway through.
  const topicKey = (UI.route==='learn' && UI.topicOpen) ? (UI.subject + '|' + UI.topic) : null;
  if (topicKey){
    if (topicKey !== readingTopicKey){ readingTopicKey = topicKey; startReadingProgress(UI.subject, UI.topic); }
  } else if (readingTopicKey){
    stopReadingProgress(); readingTopicKey = null;
  }
}

function openProfileModal(){
  const prof = STATE.auth.profile || {};
  document.getElementById('modal-root').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-box"><button class="modal-close" onclick="closeModal()">✕</button>
      <h2>Your profile</h2><p class="empty-note" style="margin-bottom:16px;">The AI Tutor adapts explanations and question difficulty to this.</p>
      <div class="field-row"><div class="field" style="margin-bottom:14px;"><label>University</label><input type="text" id="pf-university" value="${esc(prof.university||'')}"></div>
      <div class="field" style="margin-bottom:14px;"><label>Medical College</label><input type="text" id="pf-college" value="${esc(prof.college||'')}"></div></div>
      <div class="field-row"><div class="field" style="margin-bottom:14px;"><label>MBBS Year</label><select id="pf-year">${MBBS_YEARS.map(y=>`<option ${y===prof.year?'selected':''}>${y}</option>`).join('')}</select></div>
      <div class="field" style="margin-bottom:14px;"><label>Country</label><input type="text" id="pf-country" value="${esc(prof.country||'')}"></div></div>
      <div class="field" style="margin-bottom:20px;"><label>Exam Preparation</label><div class="chip-multiselect" id="pf-exam-chips">${EXAM_TARGETS.map(e=>`<button type="button" class="chip-check ${prof.examTargets&&prof.examTargets.includes(e)?'active':''}" data-exam="${esc(e)}" onclick="this.classList.toggle('active')">${esc(e)}</button>`).join('')}</div></div>
      <div style="display:flex;gap:10px;"><button class="btn primary" onclick="saveProfileModal()">Save</button>
      <button class="btn danger" onclick="if(confirm('Reset all CLINOVA data on this device? This cannot be undone.')) resetAllData();">Reset all data</button></div>
    </div></div>`;
}
function saveProfileModal(){
  const prof = STATE.auth.profile;
  prof.university = document.getElementById('pf-university').value.trim();
  prof.college = document.getElementById('pf-college').value.trim();
  prof.year = document.getElementById('pf-year').value;
  prof.country = document.getElementById('pf-country').value.trim();
  prof.examTargets = [...document.querySelectorAll('#pf-exam-chips .chip-check.active')].map(b=>b.dataset.exam);
  saveState();
  registerStudentInDirectory(prof); // keep the leaderboard directory (college/year) in sync with profile edits
  closeModal(); renderAll();
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

document.addEventListener('DOMContentLoaded', () => {
  applyTheme();
  // Cold-boot entry point: not-yet-logged-in users go straight to Login
  // after the splash (skipping the marketing Home page on first load).
  // Home is still fully intact and reachable — logout() still sends
  // returning/logged-out users there afterwards, unchanged.
  UI.route = isLoggedIn() ? (STATE.route && STATE.route!=='home' && STATE.route!=='login' && STATE.route!=='signup' ? STATE.route : 'dashboard') : 'login';
  document.getElementById('mainNav').addEventListener('click', (e)=>{ const btn=e.target.closest('.nav-item'); if (btn) goRoute(btn.dataset.route); });
  document.getElementById('profileBtn').addEventListener('click', openProfileModal);
  document.getElementById('hamburgerBtn').addEventListener('click', ()=>document.getElementById('sidebar').classList.toggle('open'));
  document.getElementById('notifBtnMobile').addEventListener('click', openNotifications);
  document.getElementById('voiceFab').addEventListener('click', voiceFabClicked);
  setAuthTab('login');
  renderAll();
  runSplashSequence();
});

/* The M.I.C.E Labs × CLINOVA composition fades in (CSS animation on
   #splash-content), holds, then the whole screen fades out — gone by
   ~3 seconds, revealing whatever page renderAll() already put
   underneath it (Login for a fresh visit, or the dashboard/last
   route for an already-authenticated returning session). */
function runSplashSequence(){
  const splash = document.getElementById('splash-screen');
  if (!splash) return;
  setTimeout(() => { splash.classList.add('fade-out'); }, 2600);
  setTimeout(() => { splash.remove(); }, 3000);
}
</script>
